<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7efe2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="待會吃什麼">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>待會吃什麼</title>
<style>
:root{--bg:#f7efe2;--card:#fffaf2;--brown:#8b5a2b;--brown-d:#5e3a1a;--caramel:#c98a4b;--line:#ead9c0;--muted:#9a7b5c;--green:#5f9e5a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--brown-d);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top) 0 40px}
button,input{font-family:inherit}
.wrap{max-width:480px;margin:0 auto;padding:16px}
header{text-align:center;margin:6px 0 10px}
header h1{margin:0;font-size:28px;letter-spacing:2px}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:22px;box-shadow:0 4px 14px rgba(139,90,43,.12);padding:16px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--brown);cursor:pointer;user-select:none}
.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.badge{display:inline-block;background:#fde3c2;color:var(--brown-d);border-radius:999px;padding:4px 10px;font-size:13px;margin:0 auto 8px}
.wheelbox{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--brown-d);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:var(--card);border:4px solid var(--brown);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--brown);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted);font-size:16px;line-height:1.6}
.spin{display:block;width:100%;margin-top:14px;border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:700;letter-spacing:2px;color:#fff;background:linear-gradient(180deg,var(--caramel),var(--brown));box-shadow:0 5px 0 var(--brown-d);cursor:pointer}
.spin:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brown-d)}
.spin:disabled{opacity:.5}
h2{font-size:18px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .info{flex:1;min-width:0}
.row .name{font-weight:700;word-break:break-word}
.row .note,.dist{font-size:13px;color:var(--muted);margin-top:2px;word-break:break-word}
.row.off .name,.row.off .note{opacity:.45;text-decoration:line-through}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px;background:#e4f1df;color:#3d6b39;vertical-align:middle;font-weight:600}
.tag.mon,.tag.closed{background:#f6dcdc;color:#a33}
.tag.open{background:#e4f1df;color:#3d6b39}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#d8c6ae;border-radius:999px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span:before{transform:translateX(18px)}
.del{border:0;background:none;font-size:18px;color:#c0a080;cursor:pointer;padding:4px}
form{display:flex;flex-direction:column;gap:8px}
input[type=text],input[type=url],input[type=time],input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;background:#fff;color:var(--brown-d)}
.chk{font-size:14px;color:var(--brown);display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px;font-size:16px;font-weight:700;background:var(--brown);color:#fff;cursor:pointer}
.btn.ghost{background:none;color:var(--muted);border:1.5px dashed var(--line);font-weight:500;width:100%;margin-top:4px}
.mask{position:fixed;inset:0;background:rgba(60,35,15,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:24px}
.mask.show{display:flex}
.result{background:var(--card);border-radius:26px;padding:26px 20px;text-align:center;max-width:360px;width:100%;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.result .emo{font-size:52px}
.result .rname{font-size:30px;font-weight:800;margin:6px 0}
.result .rnote{color:var(--muted);line-height:1.6;font-size:15px}
.result a{color:var(--brown);font-weight:700}
.result .acts{display:flex;gap:8px;margin-top:18px}
.result .acts button{flex:1}
.exts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.exts a{flex:1;min-width:120px;background:var(--brown);color:#fff;text-decoration:none;border-radius:12px;padding:10px 8px;font-weight:700}
.small{font-size:12px;color:var(--muted);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:11}
.picks{display:flex;flex-direction:column;gap:12px}
.pick{display:flex;align-items:center;gap:14px;width:100%;min-height:92px;border:0;border-radius:22px;background:var(--card);box-shadow:0 4px 14px rgba(139,90,43,.12);padding:16px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.pick:active{transform:translateY(2px)}
.pick .emo{flex:none;width:68px;height:68px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(180deg,#fde3c2,var(--caramel));box-shadow:inset 0 -4px 0 rgba(94,58,26,.12)}
.pick .t{display:block;font-size:22px;font-weight:800;letter-spacing:1px}
.pick .d{display:block;margin-top:4px;font-size:14px;color:var(--muted);font-weight:500}
.pick .go{margin-left:auto;font-size:28px;color:var(--caramel);line-height:1}
.pick.is-last{box-shadow:0 0 0 2.5px var(--caramel),0 4px 14px rgba(139,90,43,.12)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{border:0;background:transparent;color:var(--brown);font:inherit;font-weight:700;font-size:16px;padding:4px 0 8px;cursor:pointer}
.back:disabled{opacity:.4}
.sound{border:1.5px solid var(--line);background:#fff;color:var(--brown);border-radius:999px;padding:8px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.tab{flex:1 1 calc(50% - 8px);border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;font:inherit;font-size:14px;font-weight:700;color:var(--brown);cursor:pointer}
.tab.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.tab:disabled{opacity:.45}
.placeTools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.placeTools .btn.ghost{width:auto;flex:1 1 calc(50% - 8px);margin-top:0}
.placeTools .btn.on{border-style:solid;border-color:var(--brown);color:var(--brown-d)}
.edit{flex:none;border:1.5px solid var(--line);background:#fff;color:var(--brown);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.row.editing{flex-direction:column;align-items:stretch}
.editform{display:flex;flex-direction:column;gap:8px;width:100%;min-width:0}
.editacts{display:flex;gap:8px}
.editacts .btn,.editacts .btn.ghost{width:auto;flex:1;margin-top:0}
details.more{border-top:1px dashed var(--line);padding-top:8px}
details.more summary{cursor:pointer;font-weight:700;color:var(--brown);padding:6px 0}
.pair{display:flex;gap:8px}
.pair label{flex:1;font-size:13px;color:var(--muted)}
.searchlinks{display:flex;flex-wrap:wrap;gap:8px}
.searchlinks a{flex:1;min-width:140px;text-align:center;text-decoration:none;border:1.5px dashed var(--line);border-radius:12px;padding:10px 8px;color:var(--brown);font-weight:700}
.install p{margin:0 0 8px;text-align:left;line-height:1.5}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--caramel);outline-offset:2px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div class="wrap" id="picker">
  <header>
    <h1>🍜 待會吃什麼</h1>
    <p>先選一個轉盤</p>
  </header>
  <div class="picks" id="picks"></div>
  <div class="card install" id="installHint" hidden>
    <p>可以把轉盤加到主畫面，下次像小程式一樣打開。</p>
    <div class="editacts">
      <button type="button" class="btn" id="installGo">安裝</button>
      <button type="button" class="btn ghost" id="installNo">先不要</button>
    </div>
  </div>
  <p class="small">資料只存在這支手機的瀏覽器裡</p>
  <p class="small">版本 2026-11-10i</p>
</div>

<div class="wrap" id="wheelView" hidden>
  <div class="toprow">
    <button type="button" class="back" id="backBtn">← 回選單</button>
    <button type="button" class="sound" id="soundBtn" aria-pressed="true">🔊 聲音開</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <header>
    <h1 id="title"></h1>
    <p id="sub"></p>
  </header>

  <div class="card">
    <div class="chips" id="placeChips">
      <div class="chip" id="vegChip">🥬 只轉素食友善</div>
      <div class="chip" id="monChip">📅 週一自動排除公休</div>
      <div class="chip" id="openChip">🕐 只轉現在有開的</div>
    </div>
    <div style="text-align:center"><span class="badge" id="status"></span></div>
    <div class="wheelbox">
      <div class="pointer"></div>
      <canvas id="wheel" width="720" height="720"></canvas>
      <div class="hub" id="hub">轉!</div>
      <div class="empty" id="empty"></div>
    </div>
    <button type="button" class="spin" id="spinBtn">🎯 開始轉</button>
    <div class="placeTools" id="placeTools">
      <button type="button" class="btn ghost" id="locBtn">用現在位置</button>
      <button type="button" class="btn ghost" id="sortBtn">依距離排序</button>
    </div>
    <p class="small" id="locMsg" style="text-align:left;margin:8px 0 0"></p>
  </div>

  <div class="card" id="placeAdd">
    <h2>➕ 新增店家</h2>
    <form id="addForm">
      <input type="text" id="newName" placeholder="店名（必填）" maxlength="20" required>
      <input type="text" id="newNote" placeholder="備註，例如：弟弟愛吃、要訂位" maxlength="60">
      <div class="chk">
        <label><input type="radio" name="veg" value="" checked> 一般</label>
        <label><input type="radio" name="veg" value="素OK"> 素OK</label>
        <label><input type="radio" name="veg" value="全素"> 全素</label>
        <label><input type="checkbox" id="newMon"> 週一公休</label>
      </div>
      <button class="btn" type="submit">加入轉盤</button>
    </form>
  </div>

  <div class="card" id="itemAdd" hidden>
    <h2>➕ 新增</h2>
    <form id="itemForm">
      <input type="text" id="itemName" placeholder="名稱（必填）" maxlength="20" required>
      <button class="btn" type="submit">加入轉盤</button>
    </form>
  </div>

  <div class="card">
    <h2><span id="listHeading">📋 店家清單</span> <span class="small" id="count"></span></h2>
    <div class="small" id="listHint" style="text-align:left;margin-bottom:6px">右邊開關關掉＝暫時不轉（例如昨天剛吃過），不會刪除。點「編輯」可改名稱。</div>
    <div id="list"></div>
    <button type="button" class="btn ghost" id="resetBtn">↺ 恢復預設清單</button>
  </div>
  <p class="small">資料只存在這支手機的瀏覽器裡</p>
  <p class="small">版本 2026-11-10i</p>
</div>

<div class="mask" id="mask">
  <div class="result">
    <div class="emo" id="rEmo">🎉</div>
    <div class="small">今天就吃</div>
    <div class="rname" id="rName"></div>
    <div class="rnote" id="rNote"></div>
    <div class="acts">
      <button type="button" class="btn ghost" id="againBtn" style="margin:0">再轉一次</button>
      <button type="button" class="btn" id="okBtn">就吃這個！</button>
    </div>
  </div>
</div>

function expandPlace(p,i){
  const o=Object.assign({id:'d'+i,on:true,mon:false,link:'',address:'',lat:null,lng:null,hours:null,uber:'',panda:'',maps:''},p);
  o.id=p.id||('d'+i);
  if(p.on===false)o.on=false;
  if(p.dailyHours){
    o.hours={};
    for(let d=0;d<7;d++)o.hours[d]=p.dailyHours.slice();
    delete o.dailyHours;
  }
  return o;
}

function normName(s){
  return String(s==null?'':s).trim().replace(/\s+/g,'').replace(/＋/g,'+');
}
function blankField(s){
  return s==null||String(s).trim()==='';
}
function fixForPlace(p){
  if(!p)return null;
  const n=normName(p.name);
  if(!n)return null;
  if(n.indexOf('阿宏')>=0)return PLACE_FIXES.find(f=>f.name.indexOf('阿宏')>=0)||null;
  if(n.indexOf('春成')>=0)return PLACE_FIXES.find(f=>f.name.indexOf('春成')>=0)||null;
  if(n.indexOf('三禾')>=0)return PLACE_FIXES.find(f=>f.name.indexOf('三禾')>=0)||null;
  return PLACE_FIXES.find(f=>normName(f.name)===n)||null;
}
function applyPlaceFix(p){
  const fix=fixForPlace(p);
  if(!fix)return false;
  let changed=false;
  if(fix.address&&blankField(p.address)){p.address=fix.address;changed=true;}
  if(fix.maps&&blankField(p.maps)){p.maps=fix.maps;changed=true;}
  if(fix.lat!=null&&(p.lat==null||p.lat==='')){p.lat=fix.lat;p.lng=fix.lng;changed=true;}
  if(fix.note&&(p.note==null||(fix.notes&&fix.notes.indexOf(p.note)>=0))){p.note=fix.note;changed=true;}
  if(fix.vegIfEmpty&&!p.veg){p.veg=fix.vegIfEmpty;changed=true;}
  return changed;
}

function mergeInto(list,from,to){
  if(!Array.isArray(list))return false;
  const aliases=list.filter(p=>p&&p.name===from);
  if(!aliases.length)return false;
  const target=list.find(p=>p&&p.name===to);
  const aliasOn=aliases.some(p=>p.on);
  if(target){
    if(aliasOn&&!target.on)target.on=true;
    for(let i=list.length-1;i>=0;i--){if(list[i]&&list[i].name===from)list.splice(i,1);}
    return true;
  }
  const keep=aliases[0];
  keep.name=to;
  if(aliasOn)keep.on=true;
  if(to==='麻一鍋'&&!keep.mon)keep.mon=true;
  for(let i=list.length-1;i>=0;i--){if(list[i]&&list[i]!==keep&&list[i].name===from)list.splice(i,1);}
  return true;
}
function migrateKnownPlaces(db){
  let changed=false;
  ['eat','delivery'].forEach(key=>{
    const list=db[key]&&db[key].places;
    if(!Array.isArray(list))return;
    if(mergeInto(list,'螞蟻鍋','麻一鍋'))changed=true;
    if(mergeInto(list,'金井澤火鍋','輕井澤'))changed=true;
    list.forEach(p=>{
      if(applyChou(p))changed=true;
      if(applyKongye(p))changed=true;
      if(applyDapu(p))changed=true;
      if(applyShanghao(p))changed=true;
      if(applyLuwei(p))changed=true;
      if(applyPlaceFix(p))changed=true;
      if(applyShowtimeRamen(p))changed=true;
    });
    if(ensureWuhua(list))changed=true;
    if(ensureYongchun(list))changed=true;
    if(fixMiaoshanUrl(list))changed=true;
    if(ensureMiaoshan(list))changed=true;
    if(ensureQingmei(list))changed=true;
    if(ensurePinzhuan(list))changed=true;
    if(ensureZhuye(list))changed=true;
    if(ensureHuayue(list))changed=true;
    if(ensureXiong(list))changed=true;
  });
  return changed;
}
function loadDB(){
  try{
    const s=JSON.parse(localStorage.getItem(V2));
    if(validDB(s)){
      if(!s.delivery||!Array.isArray(s.delivery.places))s.delivery=freshDelivery();
      if(s.delivery.vegOnly===undefined)s.delivery.vegOnly=false;
      if(s.delivery.autoMon===undefined)s.delivery.autoMon=true;
      if(migrateKnownPlaces(s))localStorage.setItem(V2,JSON.stringify(s));
      return s;
    }
  }catch(e){}
  const db={
    last:null,screen:'picker',
    eat:freshEat(),
    cook:freshItems(catById('cook').defaults),
    breakfast:freshItems(catById('breakfast').defaults),
    night:freshItems(catById('night').defaults),
    delivery:freshDelivery()
  };
  const old=readV1();
  if(old)db.eat=old;
  migrateKnownPlaces(db);
  localStorage.setItem(V2,JSON.stringify(db));
  return db;
}

function listItems(){return kind()==='place'?S.places:S.items;}
const isMon=()=>new Date().getDay()===1;
function hasHours(p){return !!(p&&p.hours&&typeof p.hours==='object'&&Object.keys(p.hours).length);}
function taipeiNow(){
  const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',weekday:'short',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
  const parts=Object.fromEntries(fmt.formatToParts(new Date()).map(p=>[p.type,p.value]));
  const wd={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[parts.weekday];
  let hour=parts.hour;
  if(hour==='24')hour='00';
  return{wd,hm:String(hour).padStart(2,'0')+':'+String(parts.minute).padStart(2,'0')};
}
function daySlot(hours,wd){
  if(!hours)return undefined;
  if(Object.prototype.hasOwnProperty.call(hours,wd))return hours[wd];
  if(Object.prototype.hasOwnProperty.call(hours,String(wd)))return hours[String(wd)];
  return undefined;
}
function inRange(hm,open,close){
  if(!open||!close)return false;
  if(open===close)return true;
  if(open<close)return hm>=open&&hm<close;
  return hm>=open||hm<close;
}
function hoursStatus(p){
  if(!hasHours(p))return '';
  const now=taipeiNow();
  const slot=daySlot(p.hours,now.wd);
  if(slot===undefined)return '';
  if(!Array.isArray(slot)||slot.length<2||!slot[0]||!slot[1])return '今日公休';
  return inRange(now.hm,slot[0],slot[1])?'營業中':'已打烊';
}
function openEnough(p){
  if(!S.openNow)return true;
  if(!hasHours(p))return true;
  const st=hoursStatus(p);
  if(!st)return true;
  return st==='營業中';
}
function active(){
  if(kind()==='place')return S.places.filter(p=>p.on&&(!S.vegOnly||p.veg)&&!(S.autoMon&&isMon()&&p.mon)&&openEnough(p));
  return S.items.filter(p=>p.on);
}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function haversine(lat1,lng1,lat2,lng2){
  const R=6371000,toR=d=>d*Math.PI/180;
  const dLat=toR(lat2-lat1),dLng=toR(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(a)));
}
function placeDist(p){
  if(!loc||p.lat==null||p.lng==null||p.lat===''||p.lng==='')return null;
  const lat=+p.lat,lng=+p.lng;
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;
  return haversine(loc.lat,loc.lng,lat,lng);
}
function fmtDist(m){
  if(m<1000)return Math.round(m)+' 米';
  const km=m/1000;
  return (km<10?km.toFixed(1):String(Math.round(km)))+' 公里';
}
function travelHint(m){
  if(m<=1500)return '步行約 '+Math.max(1,Math.round(m/80))+' 分鐘';
  return '開車約 '+Math.max(1,Math.round(m/500))+' 分鐘';
}
function distText(p){
  const m=placeDist(p);
  if(m==null)return '';
  return fmtDist(m)+'・'+travelHint(m);
}
function uberSearch(name){return 'https://www.ubereats.com/tw/search?q='+encodeURIComponent(name+' 台中');}

const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
let rot=0,spinning=false,cur=[];
let audioCtx=null,lastSlice=-1,lastTick=0;
function ensureAudio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==='suspended'){const p=audioCtx.resume();if(p&&p.catch)p.catch(()=>{});}
  return audioCtx;
}
function startSpinSound(durMs){
  if(!soundOn)return;
  const actx=ensureAudio();
  if(!actx)return;
  const dur=durMs/1000,t0=actx.currentTime,len=actx.sampleRate;
  const buf=actx.createBuffer(1,len,actx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=Math.random()*2-1;
  const src=actx.createBufferSource();
  src.buffer=buf;src.loop=true;
  const filter=actx.createBiquadFilter();
  filter.type='lowpass';
  filter.frequency.setValueAtTime(1200,t0);
  filter.frequency.exponentialRampToValueAtTime(220,t0+dur);
  const g=actx.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.045,t0+0.12);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(filter);filter.connect(g);g.connect(actx.destination);
  src.start(t0);src.stop(t0+dur+0.05);
  lastSlice=-1;lastTick=0;
}
function blip(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='square';o.frequency.value=740;
  g.gain.setValueAtTime(0.035,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.035);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t);o.stop(t+0.04);
}
function chime(){
  if(!soundOn||!audioCtx)return;
  const t=audioCtx.currentTime;
  [523.25,659.25,783.99].forEach((f,i)=>{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),st=t+i*0.07;
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,st);
    g.gain.exponentialRampToValueAtTime(0.05,st+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.38);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(st);o.stop(st+0.4);
  });
}
function tickIfCrossed(now){
  if(!soundOn||!audioCtx||cur.length<2)return;
  const n=cur.length,a=2*Math.PI/n;
  let ang=(-Math.PI/2-rot)%(2*Math.PI);
  if(ang<0)ang+=2*Math.PI;
  const idx=Math.floor(ang/a)%n;
  if(idx!==lastSlice){
    lastSlice=idx;
    if(now-lastTick>70){lastTick=now;try{blip();}catch(e){}}
  }
}
function draw(){
  cur=active();const n=cur.length,R=360;
  ctx.clearRect(0,0,720,720);
  const empty=document.getElementById('empty');
  document.getElementById('spinBtn').disabled=spinning||n<2;
  if(n<2){
    ctx.beginPath();ctx.arc(R,R,R-8,0,7);ctx.fillStyle='#f1e4cf';ctx.fill();
    empty.style.display='flex';document.getElementById('hub').style.display='none';
    if(kind()==='place'){
      empty.innerHTML=n===0?'轉盤空空的 🥲<br>把下面清單的開關打開，或新增一家店吧！':'只剩一家：<b>'+esc(cur[0].name)+'</b><br>不用轉了，就吃這家吧 😋<br><small>（再打開一家才能轉）</small>';
    }else{
      empty.innerHTML=n===0?'轉盤空空的 🥲<br>把下面清單的開關打開，或新增一項吧！':'只剩一項：<b>'+esc(cur[0].name)+'</b><br>不用轉了，就吃這個吧 😋<br><small>（再打開一項才能轉）</small>';
    }
    return;
  }
  empty.style.display='none';document.getElementById('hub').style.display='flex';
  const a=2*Math.PI/n;
  ctx.save();ctx.translate(R,R);ctx.rotate(rot);
  for(let i=0;i<n;i++){
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R-8,i*a,(i+1)*a);ctx.closePath();
    ctx.fillStyle=COLORS[(i+(n%COLORS.length===1&&i===n-1?1:0))%COLORS.length];ctx.fill();
    ctx.strokeStyle='#fffaf2';ctx.lineWidth=4;ctx.stroke();
    ctx.save();ctx.rotate(i*a+a/2);ctx.fillStyle='#fff';
    const fs=n>14?26:n>9?30:36;ctx.font='bold '+fs+'px "PingFang TC","Noto Sans TC",sans-serif';
    ctx.textAlign='right';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=3;
    let t=cur[i].name;if(t.length>7)t=t.slice(0,6)+'…';
    ctx.fillText(t,R-34,0);ctx.restore();
  }
  ctx.restore();
  ctx.beginPath();ctx.arc(R,R,R-6,0,7);ctx.lineWidth=12;ctx.strokeStyle='#8b5a2b';ctx.stroke();
  for(let i=0;i<24;i++){const t=i/24*2*Math.PI;ctx.beginPath();ctx.arc(R+(R-6)*Math.cos(t),R+(R-6)*Math.sin(t),4,0,7);ctx.fillStyle=i%2?'#ffe8a3':'#fff';ctx.fill();}
}
function spin(){
  if(spinning||cur.length<2)return;spinning=true;
  document.getElementById('backBtn').disabled=true;
  document.querySelectorAll('.tab').forEach(t=>t.disabled=true);
  try{startSpinSound(4200);}catch(e){}
  const n=cur.length,a=2*Math.PI/n,pick=Math.floor(Math.random()*n);
  const target=-Math.PI/2-(pick*a+a/2)+(Math.random()-.5)*a*0.7;
  const base=rot-(rot%(2*Math.PI));
  let end=base+6*2*Math.PI+((target-base)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const start=rot,dur=4200,t0=performance.now();
  document.getElementById('spinBtn').disabled=true;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);
    rot=start+(end-start)*e;draw();
    try{tickIfCrossed(now);}catch(err){}
    if(p<1)requestAnimationFrame(step);else{
      spinning=false;
      document.getElementById('backBtn').disabled=false;
      document.querySelectorAll('.tab').forEach(t=>t.disabled=false);
      rot%=2*Math.PI;draw();
      try{chime();}catch(err){}
      show(cur[pick]);
    }
  })(t0);
}

function hoursFields(p){
  const closed={};
  let open='',close='';
  const h=p.hours||{};
  for(let d=0;d<7;d++){
    const slot=daySlot(h,d);
    if(slot===undefined)continue;
    if(!Array.isArray(slot)||slot.length<2){closed[d]=true;continue;}
    if(!open){open=slot[0]||'';close=slot[1]||'';}
  }
  const days=DAY_LABELS.map((lab,d)=>'<label><input type="checkbox" class="edit-closed" value="'+d+'"'+(closed[d]?' checked':'')+'>'+lab+'</label>').join('');
  return '<div class="pair"><label>開始<input type="time" class="edit-open" value="'+esc(open)+'"></label><label>結束<input type="time" class="edit-close" value="'+esc(close)+'"></label></div>'+
    '<div class="small" style="text-align:left">公休（勾選的那天不營業）</div><div class="chk">'+days+'</div>'+
    '<p class="small" style="text-align:left;margin:0">營業時間可能變動，請以店家公告為準。</p>';
}

function displayItems(){
  const items=listItems();
  if(kind()!=='place'||!S.sortDist)return items;
  return items.slice().sort((a,b)=>{
    const da=placeDist(a),db=placeDist(b);
    if(da==null&&db==null)return 0;
    if(da==null)return 1;
    if(db==null)return -1;
    return da-db;
  });
}

function numOrNull(v){
  if(v==null||String(v).trim()==='')return null;
  const n=Number(v);
  return Number.isFinite(n)?n:null;
}
function readHours(form){
  const open=form.querySelector('.edit-open').value;
  const close=form.querySelector('.edit-close').value;
  const closed=new Set([...form.querySelectorAll('.edit-closed:checked')].map(x=>x.value));
  if(!open&&!close&&!closed.size)return null;
  const hours={};
  for(let d=0;d<7;d++){
    if(closed.has(String(d)))hours[d]=[];
    else if(open&&close)hours[d]=[open,close];
  }
  return hours;
}
async function lookupAddress(form){
  const msg=form.querySelector('.geoMsg');
  const q=(form.querySelector('.edit-address').value||'').trim();
  if(!q){msg.textContent='請先填地址';return;}
  msg.textContent='查詢中…';
  try{
    const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=tw&q='+encodeURIComponent(q);
    const res=await fetch(url,{headers:{Accept:'application/json'}});
    if(!res.ok)throw new Error('bad');
    const data=await res.json();
    if(!data[0]){msg.textContent='查不到，可以自己填經緯度';return;}
    form.querySelector('.edit-lat').value=Number(data[0].lat).toFixed(6);
    form.querySelector('.edit-lng').value=Number(data[0].lon).toFixed(6);
    msg.textContent='已填入座標，按儲存才會記住';
  }catch(e){
    msg.textContent='目前查不到，可以自己填經緯度';
  }
}

});
document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-cat]');if(b)openCat(b.dataset.cat);
});
document.getElementById('backBtn').onclick=showPicker;
document.getElementById('soundBtn').onclick=()=>{
  soundOn=!soundOn;
  localStorage.setItem(SOUND_KEY,soundOn?'1':'0');
  renderSound();
};
document.getElementById('locBtn').onclick=()=>{
  const msg=document.getElementById('locMsg');
  if(!navigator.geolocation){msg.textContent='這支手機沒有提供定位，轉盤還是可以轉。';return;}
  msg.textContent='正在定位…';
  navigator.geolocation.getCurrentPosition(pos=>{
    loc={lat:pos.coords.latitude,lng:pos.coords.longitude,ts:Date.now()};
    try{sessionStorage.setItem(LOC_KEY,JSON.stringify(loc));}catch(e){}
    render();
  },err=>{
    msg.textContent=(err&&err.code===1)?'沒有取得位置權限，轉盤還是可以轉。':'目前定不到位置，轉盤還是可以轉。';
  },{enableHighAccuracy:false,timeout:8000,maximumAge:0});
};
document.getElementById('sortBtn').onclick=()=>{
  if(kind()!=='place')return;
  if(!loc){document.getElementById('locMsg').textContent='要依距離排序，請先按「用現在位置」。轉盤還是可以轉。';return;}
  S.sortDist=!S.sortDist;save();render();
};
document.getElementById('list').addEventListener('click',e=>{
  if(e.target.closest('[data-geo]')){e.preventDefault();lookupAddress(e.target.closest('form'));return;}
  if(e.target.closest('[data-cancel]')){editingId=null;render();return;}
  const eb=e.target.closest('[data-e]');
  if(eb){
    editingId=eb.dataset.e;render();
    const input=document.querySelector('.edit-name');
    if(input){input.focus();input.select();}
    return;
  }
  const db=e.target.closest('[data-d]');
  if(db){
    const p=listItems().find(x=>x.id===db.dataset.d);
    if(p&&confirm('確定刪除「'+p.name+'」？')){
      if(kind()==='place')S.places=S.places.filter(x=>x.id!==p.id);
      else S.items=S.items.filter(x=>x.id!==p.id);
      if(editingId===p.id)editingId=null;
      save();render();
    }
  }
});
document.getElementById('list').addEventListener('change',e=>{
  const t=e.target.dataset.t;if(!t)return;
  const p=listItems().find(x=>x.id===t);if(!p)return;
  p.on=e.target.checked;save();render();
});
document.getElementById('list').addEventListener('submit',e=>{
  const form=e.target;if(!form.classList||!form.classList.contains('editform'))return;
  e.preventDefault();
  const name=form.querySelector('.edit-name').value.trim();
  if(!name)return;
  const p=listItems().find(x=>x.id===form.dataset.editId);if(!p)return;
  p.name=name;
  if(kind()==='place'){
    const noteEl=form.querySelector('.edit-note');
    if(noteEl)p.note=noteEl.value.trim();
    p.address=(form.querySelector('.edit-address').value||'').trim();
    p.lat=numOrNull(form.querySelector('.edit-lat').value);
    p.lng=numOrNull(form.querySelector('.edit-lng').value);
    p.hours=readHours(form);
    const mapsEl=form.querySelector('.edit-maps');
    if(mapsEl)p.maps=mapsEl.value.trim();
    p.uber=(form.querySelector('.edit-uber').value||'').trim();
    p.panda=(form.querySelector('.edit-panda').value||'').trim();
  }
  editingId=null;save();render();
});
document.getElementById('addForm').addEventListener('submit',e=>{
  e.preventDefault();const name=document.getElementById('newName').value.trim();if(!name)return;
  S.places.push({id:'u'+Date.now(),name,note:document.getElementById('newNote').value.trim(),veg:document.querySelector('#addForm input[name=veg]:checked').value,mon:document.getElementById('newMon').checked,on:true,link:'',address:'',lat:null,lng:null,hours:null,uber:'',panda:'',maps:''});
  save();e.target.reset();render();
});
document.getElementById('itemForm').addEventListener('submit',e=>{
  e.preventDefault();const name=document.getElementById('itemName').value.trim();if(!name)return;
  S.items.push({id:'u'+Date.now(),name,on:true});
  save();e.target.reset();render();
});
document.getElementById('vegChip').onclick=()=>{if(kind()!=='place')return;S.vegOnly=!S.vegOnly;save();render();};
document.getElementById('monChip').onclick=()=>{if(kind()!=='place')return;S.autoMon=!S.autoMon;save();render();};
document.getElementById('openChip').onclick=()=>{if(kind()!=='place')return;S.openNow=!S.openNow;save();render();};
document.getElementById('resetBtn').onclick=()=>{
  const place=kind()==='place';
  const msg=place?'恢復預設清單？你新增、修改或刪除的店家會被重設。':'恢復預設清單？你新增、修改或刪除的項目會被重設。';
  if(!confirm(msg))return;
  if(place)S=catId==='delivery'?freshDelivery():freshEat();
  else S=freshItems(current().defaults);
  DB[catId]=S;editingId=null;save();render();
};
document.getElementById('spinBtn').onclick=spin;document.getElementById('hub').onclick=spin;
document.getElementById('okBtn').onclick=()=>document.getElementById('mask').classList.remove('show');
document.getElementById('againBtn').onclick=()=>{
  document.getElementById('mask').classList.remove('show');
  try{if(soundOn)ensureAudio();}catch(e){}
  setTimeout(spin,250);
};
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  if(sessionStorage.getItem('ej-food-wheel-install-hide'))return;
  deferredPrompt=e;
  document.getElementById('installHint').hidden=false;
});
document.getElementById('installGo').onclick=async()=>{
  document.getElementById('installHint').hidden=true;
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  try{await deferredPrompt.userChoice;}catch(e){}
  deferredPrompt=null;
};
document.getElementById('installNo').onclick=()=>{
  document.getElementById('installHint').hidden=true;
  try{sessionStorage.setItem('ej-food-wheel-install-hide','1');}catch(e){}
};

const cc=document.getElementById('confetti'),cx=cc.getContext('2d');
function confetti(){
  cc.width=innerWidth;cc.height=innerHeight;
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*6+4,c:COLORS[Math.floor(Math.random()*COLORS.length)],r:Math.random()*6}));
  let f=0;(function tick(){cx.clearRect(0,0,cc.width,cc.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);cx.restore();});
    if(++f<110)requestAnimationFrame(tick);else cx.clearRect(0,0,cc.width,cc.height);})();
}
if('serviceWorker' in navigator && location.protocol!=='file:'){
  let reloading=false;
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadController||reloading)return;
    reloading=true;
    location.reload();
  });
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
    if(reg&&reg.update)reg.update().catch(()=>{});
  }).catch(()=>{});
}
if(DB.screen==='wheel'&&DB.last&&DB[DB.last]&&CATS.some(c=>c.id===DB.last)){
  catId=DB.last;S=DB[DB.last];
  document.getElementById('picker').hidden=true;
  document.getElementById('wheelView').hidden=false;
  render();
}else renderPicker();
</script>
</body>
