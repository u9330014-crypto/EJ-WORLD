<style>
  :root {
    --bg: #f4f1ea;
    --ink: #1c2a22;
    --accent: #0f6b5c;
    --card: rgba(255,255,255,.92);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--ink); }
  #map { position: absolute; inset: 0; }
  .panel {
    position: absolute; z-index: 1000; top: 16px; left: 16px;
    background: var(--card); backdrop-filter: blur(8px);
    border-radius: 16px; padding: 16px 18px; box-shadow: 0 8px 24px rgba(20,40,30,.15);
    max-width: min(360px, calc(100vw - 32px));
  }
  h1 { margin: 0 0 4px; font-size: 1.15rem; letter-spacing: .04em; }
  .sub { margin: 0 0 10px; font-size: .85rem; color: #456; }
  label { font-size: .8rem; color: #456; display: block; margin-bottom: 4px; }
  select {
    width: 100%; font: inherit; padding: 6px 8px; border-radius: 8px;
    border: 1px solid #c5d0c8; background: #fff;
  }
  .stats { margin-top: 10px; font-size: .82rem; color: #345; }
  .legend { margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: .75rem; color: #567; }
  .dot { border-radius: 50%; background: rgba(15,107,92,.35); border: 2px solid var(--accent); display: inline-block; }
  .popup h3 { margin: 0 0 6px; font-size: 1rem; }
  .popup p { margin: 0; font-size: .85rem; line-height: 1.5; }
</style>
</head>

  <p class='sub'>依 8 月人次調整光點大小，座標為村或鄉鎮概略位置</p>
  <label for="county">縣市</label>
  <select id="county"><option value="">全部縣市</option></select>
  <div class="stats" id="stats"></div>
  <div class="legend">
    <span class="dot" style="width:10px;height:10px"></span>較少人次
    <span class="dot" style="width:20px;height:20px"></span>較多人次
  </div>
</div>

const COUNTIES = ["南投縣", "台中市", "彰化縣"];
const VALUE_LABEL = "人次";
const map = L.map('map', { zoomSnap: 0.5 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

const select = document.getElementById('county');
COUNTIES.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c;
  select.appendChild(opt);
});

const layer = L.layerGroup().addTo(map);
const markers = [];

function popupHtml(p) {
  const extras = Object.entries(p.extras || {}).map(([k,v]) => `<p>${k}：${v}</p>`).join('');
  const code = p.id ? `<p>代號：${p.id}</p>` : '';
  return `<div class="popup"><h3>${p.name}</h3>
    <p>${p.county}　${p.address}</p>
    <p>${VALUE_LABEL}：${p.value}</p>
    ${extras}${code}</div>`;
}

function draw(county) {
  layer.clearLayers();
  markers.length = 0;
  const rows = POINTS.filter(p => !county || p.county === county);
  rows.forEach(p => {
    const m = L.circleMarker([p.lat, p.lon], {
      radius: p.radius,
      color: '#0f6b5c',
      weight: 2,
      fillColor: '#1aa58a',
      fillOpacity: 0.55
    }).bindPopup(popupHtml(p));
    m.addTo(layer);
    markers.push(m);
  });
  const sum = rows.reduce((a, p) => a + p.value, 0);
  document.getElementById('stats').textContent =
    `據點 ${rows.length} 處，${VALUE_LABEL}合計 ${sum.toLocaleString('zh-Hant')}`;
  if (rows.length) {
    const b = L.latLngBounds(rows.map(p => [p.lat, p.lon]));
    map.fitBounds(b.pad(0.18));
  }
}

select.addEventListener('change', () => draw(select.value));
draw('');
</script>
</body>
</html>
