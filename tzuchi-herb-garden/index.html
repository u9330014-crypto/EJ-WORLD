<style>
/* Layout: full-screen 3D scene; floating title, view buttons at bottom, island info as a bottom sheet */
:root{
  --bg:#eaf6ff; --paper:#ffffff; --ink:#33352b; --ink-soft:#6b6a58; --line:#e6e0cc;

.title{background:rgba(255,255,255,.92);border-radius:18px;padding:10px 16px;box-shadow:var(--shadow);pointer-events:auto;min-width:0}
.tally{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(58px,1fr));gap:5px;max-width:200px}.tally .st{min-width:0;background:#eef6e6;border-radius:10px;padding:4px 6px 5px;text-align:center;line-height:1.15}.tally .st b{display:block;font-size:19px;font-weight:700;color:#3f7f3a;font-variant-numeric:tabular-nums;white-space:nowrap}.tally .st b i{font-style:normal;font-size:11.5px;font-weight:500;margin-left:2px}.tally .st span{display:block;font-size:11px;color:#5f7a58;white-space:nowrap}
.title h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;line-height:1.2}
.wx{pointer-events:auto;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;border:0;background:rgba(255,255,255,.92);box-shadow:var(--shadow);border-radius:14px;padding:7px 12px;max-width:46%;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:left}
.rcol{flex:0 0 auto;max-width:46%;display:flex;flex-direction:column;align-items:flex-end;gap:6px}.rcol .wx{max-width:none}
.visits{pointer-events:auto;background:rgba(255,255,255,.92);box-shadow:var(--shadow);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--ink-soft);white-space:nowrap;display:flex;align-items:baseline;gap:6px}
.visits b{font-family:var(--display);font-weight:400;font-size:17px;color:#3f7f3a;letter-spacing:2px;font-variant-numeric:tabular-nums}
.wx #wxTime{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.wx.night{background:rgba(38,50,74,.92);color:#e8eefc}
.wx #wxSky{text-align:right;line-height:1.35}
.title p{margin:2px 0 0;font-size:12px;color:var(--ink-soft)}
.views{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;pointer-events:none}
.views button{pointer-events:auto;border:0;border-radius:999px;padding:10px 16px;font-family:var(--display);font-size:15px;background:rgba(255,255,255,.95);color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
.views button[aria-pressed="true"]{background:var(--leaf);color:#fff}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tag{position:fixed;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:0;background:#fff;color:var(--ink);font-family:var(--display);font-size:14px;padding:4px 10px 5px;border-radius:12px;box-shadow:0 3px 8px rgba(0,0,0,.18);white-space:nowrap}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.tag i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 84px);transform:translateX(-50%);background:#3f7440;color:#fff;font-family:var(--display);font-size:14px;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center;z-index:2000}
.ptag{background:#3f7440;color:#fff;font-size:13px;line-height:1.05;letter-spacing:1px;padding:8px 4px 7px;border-radius:9px;writing-mode:vertical-rl;text-orientation:upright}

.ptag::after{border-top-color:#3f7440}
.snaketag{background:#6b5a3a;color:#fff6d0;font-size:13px;z-index:2400}
.snaketag::after{border-top-color:#6b5a3a}
.ptag.hl{background:#f2a07b;transform:translate(-50%,-100%) scale(1.25);opacity:1!important;z-index:2500!important;animation:pulse 1s ease-in-out 3}
.ptag.hl::after{border-top-color:#f2a07b}
@keyframes pulse{50%{transform:translate(-50%,-100%) scale(1.45)}}
.offh{font-family:var(--display);font-weight:400;font-size:16px;margin:16px 0 0}
.offgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.offc{border:2px solid #ece6d2;background:#fff;border-radius:12px;padding:4px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--ink)}
.offc:not(.on){opacity:.75;border-style:dashed}
.offc.on{border-color:#5e9a5a;background:#eef6e8}
.offc img{width:100%;max-width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;margin:0}
.offc b{font-family:var(--display);font-weight:400;font-size:14px}
.offc span{font-size:11px;color:var(--ink-soft)}
.back{margin-top:12px;border:0;background:#eef6e8;border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer}
.hlist{margin:12px 0 0;padding-left:20px;font-size:15px;line-height:1.7}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:72%;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .28s ease}
.sheet.open{transform:none}
.sheet{z-index:3000}
body.sheet-open #tags{visibility:hidden}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.sheet .sub{color:var(--ink-soft);font-size:13px;margin-top:2px}
.sheet img{width:100%;max-width:100%;border-radius:14px;margin-top:12px;display:block}
.sheet p{font-size:15px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;background:#eef6e8;border-radius:99px;padding:3px 10px}
.chip.q{background:#fdf1c9}
.close{float:right;border:0;background:#f3efe2;border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.hint{font-size:12px;color:var(--ink-soft);background:#fffbe8;border-radius:12px;padding:8px 12px;margin-top:12px}
.load{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:18px;color:var(--ink-soft)}

/* ===== 認得我嗎：看圖猜藥草 ===== */
.quiz{position:fixed;inset:0;z-index:3500;background:rgba(40,50,30,.45);display:flex;align-items:flex-end;justify-content:center}
.quiz[hidden]{display:none}
.qbox{background:var(--paper);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px);box-sizing:border-box}
@media (min-width:700px){.quiz{align-items:center}.qbox{border-radius:22px}}
.qtop{display:flex;align-items:center;gap:8px}
.qtop h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;flex:1}
.qcount{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.qrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qchip{border:0;background:#f1eee2;color:var(--ink);border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.qchip[aria-pressed="true"]{background:#3f7440;color:#fff}
.qpic{position:relative;margin-top:10px;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:#dfe8d5}
.qpic{touch-action:none;cursor:grab;user-select:none}
.qpic img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;pointer-events:none;user-select:none}
.qtip{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;font-size:11.5px;border-radius:99px;padding:3px 9px;pointer-events:none}
.qans .where{font-size:15px;color:#2f5a2c;font-weight:500}
.qhints{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.qhints li{background:#fffbe8;border-radius:12px;padding:7px 12px;font-size:14.5px;line-height:1.5}
.qhints li b{font-weight:500;color:#8a6a1a;margin-right:4px}
.qopts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.qopts button{border:2px solid #e6e0cc;background:#fff;border-radius:12px;padding:9px 4px;font-family:var(--display);font-size:16px;cursor:pointer;color:var(--ink)}
.qopts button.ok{border-color:#5e9a5a;background:#eef6e8}
.qopts button.no{border-color:#e0a090;background:#fbeee9;opacity:.7}
.qbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qbtns button{flex:1 1 30%;border:0;border-radius:14px;padding:11px 8px;font-family:var(--display);font-size:16px;cursor:pointer;background:#f1eee2;color:var(--ink)}
.qbtns .main{background:#3f7440;color:#fff}
.qbtns .warm{background:#f2a07b;color:#fff}
.qans{margin-top:12px;background:#eef6e8;border-radius:14px;padding:12px 14px}
.qans h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0;color:#2f5a2c}
.qans .sci{font-size:13px;color:var(--ink-soft);margin-top:2px}
.qans p{margin:6px 0 0;font-size:14px;line-height:1.55}
.qans .warn{color:#a04020}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.qpic img{transition:none}}
</style>

<script>
/* ===== 暫定島嶼（名稱與植物待確認）===== */
const ZN={A:"正見",B:"正思惟",C:"正語",D:"正業",E:"正命",F:"正精進",G:"正念",H:"正定"};
const ISLANDS=[
 {id:"welcome",n:"唐式迴廊",c:"#f2a07b",p:[0,3,32],img:"img/welcome.jpg",pos:"沿廣場三面相連的 U 字形古風木造迴廊",plants:["虎尾蘭（名牌）","吊蘭？","酢醬草？"],d:"木柱、灰瓦斜頂的唐式迴廊沿廣場西、南、東三面相連成 U 字形。迴廊旁圍著白色路燈的長條花壇是巡禮起點，種了虎尾蘭等日常好認的植物。"},
 {id:"bed1",n:"正見區",c:"#5a9bc4",p:[0,0,0],img:"img/zoneA2.jpg",img2:"img/zoneA.jpg",more:[{src:"img/a_xiangmao.jpg",cap:"近照：香茅草，禾本科 Cymbopogon citratus。立在路燈底座旁，配有中醫部製作的正式解說牌（別名香草、檸檬草；性味辛溫；功效祛風濕等）。"}],pos:"八大法印藥園區・上排、靠 A 棟一側",plants:["薄荷（名牌）","甜菊（名牌）","香茅草（正式解說牌；路燈底座旁）","咖哩樹（名牌確認，芸香科；後方羽狀複葉小樹）","灰綠色小葉灌木叢（兩側）","蝶豆（藍色蝶形花，纏繞右側灌木）","其餘名牌待拍近照"],d:"從前門往花園方向拍。前半部是剛翻過的土，左前方插著「薄荷」名牌、右前方是「甜菊」；中間一片匍匐蔓延的綠色小葉植物，看起來就是薄荷。後半部正中央一株咖哩樹（羽狀複葉小樹），兩側各一叢灰綠色小葉灌木，樹下有一顆石頭，最後方是路燈和病媒蚊防治告示牌。"},
 {id:"bed2",n:"正思惟區",c:"#e0786a",p:[0,0,0],img:"img/zoneB2.jpg",img2:"img/zoneB.jpg",more:[{src:"img/b_conglan.jpg",cap:"近照：兩側鑲邊的細圓柱狀葉叢，開白色六瓣花、黃色花蕊，應是蔥蘭（玉簾）。名牌字跡已褪色，建議重寫。旁邊有酢醬草。"}],pos:"八大法印藥園區・上排中（最大）",plants:["紫色穗狀花（鼠尾草類？）","紅繁星花？","粉紅長春花？","白色小花（右前）","黃色羽狀花穗（左側）","斑葉小灌木","灰綠葉低矮植物？","蔥蘭（玉簾，兩側鑲邊；名牌字跡模糊）","後方劍形葉叢與黃花灌木"],d:"從前門往花園方向拍（全景）。花圃呈梯形，兩側斜邊整排種著蔥蘭鑲邊（細圓柱狀葉、開白花）。前排三叢紅花，右前方一叢白色小花；左側有黃色羽狀花穗和粉紅色花；中段一整排紫色穗狀花，夾著斑葉小灌木和一叢灰綠色低矮植物；後方是劍形葉的草叢和開黃花的灌木。左邊路燈上掛著「藥草園區」和病媒蚊防治的牌子。"},
 {id:"bed3",n:"正語區",c:"#7bb36a",p:[0,0,0],img:"img/zoneC2.jpg",img2:"img/zoneC.jpg",more:[{src:"img/c_diaolan2.jpg",cap:"全景：吊蘭兩叢（名牌）。右下角有葉緣乳白、圓齒的斑葉植物，像斑葉左手香；地面滿是蛇莓（黃花）與積雪草。"},{src:"img/c_diaolan.jpg",cap:"近照：吊蘭（名牌）。地面有開黃花的三出複葉地被（蛇莓？）與圓葉的積雪草？"},{src:"img/c_yiyi.jpg",cap:"近照：薏苡（正式解說牌）。禾本科高大草本，寬線形葉、中脈白色，高過人頭；基部葉鞘乾枯呈褐黃，前方是左手香與羽狀葉地被。"},{src:"img/c_zuoshouxiang2.jpg",cap:"近照：左手香（手寫名牌）。葉片圓卵形、邊緣鋸齒、密生絨毛，成片匍匐；名牌後方是羽狀蕨類，牌上停著一對蚱蜢。"},{src:"img/c_zuoshouxiang.jpg",cap:"近照：左手香（名牌）。葉片厚、密生絨毛、邊緣圓齒，成片生長；名牌後方是羽狀蕨類。"}],pos:"八大法印藥園區・上排、靠 B 棟一側",plants:["澳洲茶樹（互葉白千層）","吊蘭（名牌確認）","斑葉左手香？（葉緣乳白，右前方）","左手香（名牌確認）","蛇莓？（黃花、三出複葉地被）","積雪草？（圓腎形葉）","酢醬草類（心形三小葉）","羽狀細葉植物（含羞草類？）","薏苡（名牌確認，中央高禾草）","山蘇（鳥巢蕨）"],d:"從前門往花園方向拍。右側一棵澳洲茶樹，樹幹從右下往左上彎成弧形，樹皮層層剝落，細針狀的樹冠罩在花圃中央上方；樹腳是一叢山蘇。中間一叢薏苡（名牌確認），寬葉高稈、高過人頭；地面是心形葉的地被，夾著紫色小花，後方近中央立著路燈，附近開著小白花。名牌在前緣正中央和左側。"},
 {id:"bed4",n:"正業區",c:"#d9904a",p:[0,0,0],img:"img/zoneD2.jpg",img2:"img/zoneD.jpg",more:[{src:"img/d_muzei.jpg",cap:"近照：台灣木賊（名牌）。莖細長中空、一節一節的，節上有黑褐色鞘齒，幾乎沒有葉子；叢間夾著寬披針形、平行脈的葉片（淡竹葉？）。"},{src:"img/d_chunbulao.jpg",cap:"近照：春不老（解說牌編號 C005，紫金牛科，附 QR code）。多分枝的小喬木，葉片長橢圓、厚而有光澤，新芽與葉柄帶紅色。"},{src:"img/d_xiaobogudan.jpg",cap:"近照：小駁骨丹（爵床科，學名 Gendarussa vulgaris Nees；附 QR code 解說牌，別名含接骨筒等，功效有活血、消腫止痛）。灌木，葉片細長披針形、對生，嫩綠有光澤，莖節略膨大。"},{src:"img/d_mutong.jpg",cap:"近照：五葉木通（名牌）。木質藤本，掌狀複葉由 5 片倒卵形小葉組成，紅褐色的莖互相纏繞，攀在支架上長成一大團圓球。地面開著淡紫色小菊花。"},{src:"img/d_maoxucao.jpg",cap:"近照：貓鬚草（又名化石草，名牌）。唇形科草本，莖略帶紫褐色、方形，葉對生、卵形有粗鋸齒，部分葉片有黃色斑；開花時白色花冠伸出長長的雄蕊，像貓的鬍鬚。"},{src:"img/d_yizhiren.jpg",cap:"近照：益智（解說牌 E005，薑科，學名 Alpinia oxyphylla Miq.，藥材名益智仁；功效溫脾…）。多年生草本，高可過人，莖叢生，葉片寬長披針形、兩列互生，像竹葉放大版。"}],pos:"八大法印藥園區・下排第 1 塊（最靠 A 棟）",plants:["貓鬚草（化石草，名牌確認）","益智仁（解說牌 E005，薑科）","台灣木賊（名牌確認）","五葉木通（名牌；纏繞成圓球形的藤本）","小駁骨丹（解說牌；中央細長披針葉灌木叢）","掌狀裂葉植物（木薯？）","左側大型小葉灌木","春不老（解說牌 C005，紫金牛科；中後方亮葉小喬木）","黃色小花","淡紫色小花地被"],d:"從前門往花園方向拍。右側一團纏繞成圓球的五葉木通最醒目，球前有一株掌狀裂葉植物；中間是一大叢細長披針葉往外披散的小駁骨丹；左側是枝葉茂密的小葉灌木，旁邊開著黃色小花；後方立著一棵亮綠葉的小喬木，是春不老（解說牌 C005）。前緣中央有一片乾草，右前方是淡紫色小花，名牌集中在中間前排。"},
 {id:"bed5",n:"正命區",c:"#4aa59a",p:[0,0,0],img:"img/zoneE2.jpg",img2:"img/zoneE.jpg",more:[{src:"img/e_jinyinhua.jpg",cap:"近照：金銀花（忍冬，名牌）。藤蔓纏繞在交叉斜插的竹竿架上，葉對生、卵形，右上角可見白黃色的花。架下混生咸豐草（白色小花），上方有藍紫色小花。"},{src:"img/e_hanxiao.jpg",cap:"近照：含笑（名牌）。木蘭科常綠小喬木，枝條灰白、用繩子拉開整形；葉橢圓、厚革質、深綠有光澤，枝上有許多褐色毛絨的花苞。樹下開著淡紫色小菊花。"},{src:"img/e_heimianma.jpg",cap:"近照：黑面馬（又名烏面馬，名牌）。半蔓性亞灌木，莖細長多分枝、略帶紫色，葉互生、卵形全緣；枝端有白色小花的花序（已開過）。"},{src:"img/e_shannai.jpg",cap:"近照：山柰（名牌寫作「山奈」，藥材通用寫法為山柰）。在竹竿架下貼地叢生，葉片寬披針形、邊緣略波浪、基部包成鞘狀，一叢叢密集。"},{src:"img/e_malan.jpg",cap:"近照：馬蘭（菊科，名牌）。前緣成片開著淡藍紫色的小菊花，舌狀花細長、中心黃色；葉互生、披針形，邊緣疏齒。"},{src:"img/e_tongbancao.jpg",cap:"⚠ 近照：名牌寫「紫花地丁」，但植株是細長鋸齒葉、開白色細長管狀花（花冠末端五裂成星形），外觀符合同瓣草（長星花 Hippobroma longiflora），不是堇菜科的紫花地丁。同瓣草全株有毒，乳汁會刺激眼睛與皮膚，請現場確認並更正名牌。"}],pos:"八大法印藥園區・下排第 2 塊",plants:["南五味（紅骨蛇，名牌確認；藤本）","含笑（名牌確認，木蘭科小喬木）","黑面馬（烏面馬，名牌確認；白花丹）","山柰（名牌寫「山奈」，薑科；竹架下）","後方大樹：細羽狀葉、垂掛長莢（辣木？）","紫紅葉植物（朱蕉／紅竹？）","馬蘭（菊科，名牌確認；前緣成片的淡紫小菊）","威靈仙（名牌確認；照片待補）","⚠ 名牌寫「紫花地丁」，植株疑為同瓣草（長星花，有毒）","細長披針葉草本叢","金銀花（忍冬，名牌確認；攀在交叉竹架上）","咸豐草（白花，混生）","藍紫色穗狀小花（長穗木類？）","大葉千斤拔（名牌確認，豆科；右側闊葉灌木）","左後方深紫葉小灌木","橘紅色小花一朵"],d:"從前門往花園方向拍。後方一棵大樹枝葉細碎、垂掛著許多長條莢果，很像辣木。花圃前緣開滿馬蘭的淡紫色小菊花，中間是一大片細長披針葉的草本，夾著一朵橘紅色小花；中後方是紫紅葉的紅竹，右側一排交叉竹竿架上攀著金銀花，右側是闊葉灌木，左後方有一叢深紫色葉子的小灌木。名牌集中在右前方。"},
 {id:"bed6",n:"正精進區",c:"#c4567e",p:[0,0,0],img:"img/zoneF2.jpg",img2:"img/zoneF.jpg",more:[{src:"img/f_guoshanxiang.jpg",cap:"近照：過山香（名牌）。芸香科小喬木，數枝深褐色主幹，奇數羽狀複葉、小葉多而細長，排列整齊像蕨葉；揉葉有特殊香氣。右側那叢寬大長葉就是月桃，樹下纏著心形葉的藤蔓。"},{src:"img/f_yuetao.jpg",cap:"近照：月桃（薑科，學名 Alpinia speciosa K. Schum.；中醫部正式解說牌：別名草蔻、玉桃、良羌、豔山薑等，味辛性溫，種子芳香健胃）。高大叢生，葉片長披針形、兩列互生、葉緣光滑有中肋。地面有開黃色小菊花的地被。"},{src:"img/f_yinchen.jpg",cap:"近照：茵陳蒿（菊科，學名 Artemisia capillaris Thunb.；中醫部正式解說牌，功效清熱利濕）。左側亮綠色、葉細如絲、直立成穗狀的就是茵陳蒿；右側葉片較寬、細裂成羽狀的另一種蒿類，可能是黃花蒿（青蒿），兩者正好對照。"},{src:"img/f_maimendong.jpg",cap:"近照：麥門冬（名牌）。叢生，葉片細長帶狀、深綠，有平行脈，葉尖常乾枯成黃褐色；地下塊根即藥材麥冬。"}],pos:"八大法印藥園區・下排第 3 塊（中央）",plants:["枸骨（名牌確認，冬青科）","修剪過、落葉的扭曲小樹","南嶺蕘花（正式解說牌，瑞香科；灰綠小圓葉灌木）","黃綠色肉質輪生葉小草本（景天類？）","過山香（名牌確認，芸香科；羽狀複葉小樹）","月桃（正式解說牌，薑科 Alpinia speciosa）","茵陳蒿（正式解說牌，菊科 Artemisia capillaris）","細裂葉蒿類（黃花蒿／青蒿？）","麥門冬（名牌確認；前緣叢生）","仙鶴草／龍芽草（手寫名牌確認；前方中段）","鯽魚膽／闊苞菊（正式解說牌 C017；左側步道邊灌木）","萬點金／燈稱花（手寫名牌；左後方，植株待確認）","黃色小菊花地被（蟛蜞菊類？）","後方大型灌木","左後方細枝幼樹","禾草地被"],d:"從前門往花園方向拍。夾在兩條步道間的細長花圃，地面幾乎都是禾草。中間一株修剪過、枝幹扭曲、目前落葉的小樹；右邊緊鄰一株細幹的灌木，小圓葉灰綠色，右側枝頭開著淡粉紅色小花；前右方是一叢黃綠色、葉片肉質輪生的小草本。後方有羽狀複葉的過山香和一大叢灌木，左後方是一株細枝幼樹。"},
 {id:"bed7",n:"正念區",c:"#9a7ac4",p:[0,0,0],img:"img/zoneG2.jpg",img2:"img/zoneG.jpg",more:[{src:"img/g_heshouwu.jpg",cap:"近照：何首烏（名牌）。纏繞性藤本，攀成一大團；葉互生、三角狀心形、先端尖，莖細長帶紅褐色。辨識小訣竅：蓼科植物的莖節上有膜質「托葉鞘」，可在現場翻看確認。"}],pos:"八大法印藥園區・下排第 4 塊",plants:["何首烏（名牌確認；纏繞藤本成團）","左側卵形葉大灌木","馬利筋（橘紅花，左前與右側各一叢）？","麥門冬（手寫名牌確認；右前兩叢）","右側羽毛狀細葉直立草本（茵陳蒿？）","金針（萱草；手寫名牌確認，右側中段）","艾草（手寫名牌確認，左前方）","葉下珠屬（名牌寫雷公根／蝴蝶草，右後方大樹旁）","月桃（正式解說牌確認，左後方步道邊）","紫蘇（用戶確認；中段，紫葉斜倚數株）","淡藍紫色小花地被","土芭樂（番石榴；右後方斜幹，主幹上著生山蘇）"],d:"從前門往花園方向拍。左側一株多分枝的卵形葉大灌木最醒目；左前角與右側各有一叢開橘紅色小花、葉片細長的植物，很像馬利筋；右前方是兩叢細長葉片的叢生草本，旁邊插著名牌；右側中後段有幾株羽毛狀細葉、直立如穗的草本；地面滿是地被，夾著淡藍紫色小花。右後方小樹上著生山蘇，旁邊就是大樓。"},
 {id:"bed8",n:"正定區",c:"#8a8f4a",p:[0,0,0],img:"img/zoneH2.jpg",img2:"img/zoneH.jpg",more:[{src:"img/h_fengweicao.jpg",cap:"近照：鳳尾草（名牌）。低矮蕨類，羽片細長、邊緣有細齒，葉片中央沿主脈有一條銀白色斑紋，外觀像劍葉鳳尾蕨的白斑變種（白斑鳳尾蕨）。民間「鳳尾草」也常指井欄邊草，兩者同屬，可對照教學。周圍是積雪草與酢醬草地被，後方有馬蘭的淡紫小花。"}],pos:"八大法印藥園區・下排第 5 塊（最靠 B 棟）",plants:["虎耳草（名牌確認；貼地小圓葉）","虎尾蘭（名牌確認；路燈基座旁）","鳳尾草（名牌確認；葉中央帶銀白斑，似白斑鳳尾蕨）","射干（手寫名牌確認；後方步道邊）","蘇鐵", "披針形葉灌木（馬藍／板藍類？）", "蕨類（腎蕨或鳳尾蕨類？）", "後方小喬木", "白色小花地被"],d:"從前門往花園方向拍。中央偏左一株蘇鐵，左右被披針形葉的灌木叢圍著，下層是蕨類；後方一棵樹幹彎曲的小喬木，樹下是一排細長葉的草叢；地面滿是地被。前緣與右側一共插了六塊名牌。右手邊是 B 棟大樓前的白色花台。"},
 {id:"zone",n:"八大法印藥園區",c:"#3f7440",p:[0,7,-19],img:"img/herbs.jpg",pos:"中庭盡頭，上下兩排弧形分區",plants:["正見","正思惟","正語","正業","正命","正精進","正念","正定"],d:"中庭盡頭的主要藥草園，以八正道命名分成八區：上排正見、正思惟、正語，下排正業、正命、正精進、正念、正定。點各區標籤可看該區植物。"},

function hipRoof(x,y,z,w,d,h,solar=true,col="#f1f1ec"){

    else{camera.position.set(p.x,1.6,p.z);controls.target.set(lx,1.0,lz);}}
  // 防止鏡頭鑽到地面下或建築物裡（避免畫面出現一大片空白）
  if(camera.position.y<0.5)camera.position.y=0.5;if(controls.target.y<0.2)controls.target.y=0.2;
  if(camera.position.y<24)SEGS.forEach(g=>{const vx=g.x2-g.x1,vz=g.z2-g.z1,L2=vx*vx+vz*vz||1;let t=((camera.position.x-g.x1)*vx+(camera.position.z-g.z1)*vz)/L2;t=Math.max(0,Math.min(1,t));
    const px=g.x1+vx*t,pz=g.z1+vz*t,dx=camera.position.x-px,dz=camera.position.z-pz,d=Math.hypot(dx,dz),lim=Math.min(g.r-1,9);if(d<lim){const k=lim/(d||1);camera.position.x=px+dx*k;camera.position.z=pz+dz*k;}});
  controls.update();renderer.render(scene,camera);
  const w=renderer.domElement.clientWidth,h=renderer.domElement.clientHeight;
  TAGS.forEach(t=>{tmp.copy(t.v).project(camera);const vis=tmp.z<1&&Math.abs(tmp.x)<1.05&&Math.abs(tmp.y)<1.05&&camera.position.distanceTo(t.v)<180&&!(t.is.id.startsWith("bed")&&camera.position.distanceTo(t.v)<16)&&camera.position.y>8;t.el.classList.toggle("hide",!vis);if(vis){t.el.style.left=((tmp.x+1)/2*w)+"px";t.el.style.top=((1-tmp.y)/2*h)+"px";}});
  {const hp=SNAKE.head();tmp.set(hp.x,hp.y+0.12,hp.z);const d=camera.position.distanceTo(tmp);tmp.project(camera);const vis=tmp.z<1&&Math.abs(tmp.x)<1.02&&Math.abs(tmp.y)<1.02&&d<12;SNAKE.lab.classList.toggle("hide",!vis);if(vis){SNAKE.lab.style.left=((tmp.x+1)/2*w)+"px";SNAKE.lab.style.top=((1-tmp.y)/2*h)+"px";}}
  PTAGS.forEach(t=>{tmp.copy(t.v).project(camera);const d=camera.position.distanceTo(t.v);const vis=tmp.z<1&&Math.abs(tmp.x)<1.02&&Math.abs(tmp.y)<1.02&&d<40;t.el.classList.toggle("hide",!vis);if(vis){t.el.style.left=((tmp.x+1)/2*w)+"px";t.el.style.top=((1-tmp.y)/2*h)+"px";t.el.style.zIndex=String(1000-Math.round(d*10));t.el.style.opacity=d<30?1:Math.max(.35,(40-d)/10);}});
}
document.getElementById("load").remove();
loop();


/* ===== 參訪人次（GitHub 版）：GoatCounter 計數，顯示 = 起始值 878 + 累計訪客 ===== */
const GC_CODE="tzuchi-herbgarden", VISIT_BASE=878;
(function(){
  const out=document.getElementById("vnum"),show=n=>out.textContent=String(VISIT_BASE+n).padStart(5,"0");
  const sc=document.createElement("script");sc.async=true;sc.src="https://gc.zgo.at/count.js";
  sc.dataset.goatcounter=`https://${GC_CODE}.goatcounter.com/count`;document.head.appendChild(sc);
  const load=()=>fetch(`https://${GC_CODE}.goatcounter.com/counter/TOTAL.json`).then(r=>r.ok?r.json():null)
    .then(d=>{if(d&&d.count!=null)show(parseInt(String(d.count).replace(/\D/g,""),10)||0);}).catch(()=>{});
  setTimeout(load,1500);
})();
