<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>純素台灣大冒險 🌱</title>
<link rel="icon" href="data:,">
<style>
:root{--g:#4f9d5d;--gd:#2f6b3c;--gl:#dff0d8;--bg:#fbf6e9;--card:#fffdf6;--ink:#3b3a30;--mute:#7a7766;--or:#f2a65a;--red:#d9534f;--line:#e8dfc6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
a{color:var(--gd)}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header.top{text-align:center;padding:20px 8px 4px}
header.top h1{margin:0;font-size:30px;color:var(--gd);letter-spacing:1px}
header.top p{margin:6px 0 0;color:var(--mute);font-size:17px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.mode{border:3px solid var(--line);background:var(--card);border-radius:22px;padding:14px 8px;text-align:center;font-weight:700;font-size:19px;color:var(--ink);min-height:92px;transition:.15s}
.mode .e{display:block;font-size:34px;line-height:1.2}
.mode[aria-pressed=true]{border-color:var(--g);background:var(--gl);box-shadow:0 4px 0 var(--g)}
.hero{background:var(--card);border:2px dashed var(--g);border-radius:22px;padding:18px;text-align:center}
.hero .big{font-size:56px;line-height:1}
.hero h2{margin:8px 0 4px;color:var(--gd)}
.hero ul{text-align:left;margin:10px auto 0;max-width:420px;padding-left:20px;color:var(--mute);font-size:16px}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--g);color:#fff;font-weight:700;padding:12px 24px;min-height:48px;font-size:18px;text-decoration:none;box-shadow:0 3px 0 var(--gd)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gd)}
.btn.alt{background:var(--or);box-shadow:0 3px 0 #c9823a;color:#4a2c00}
.btn.ghost{background:#fff;color:var(--gd);border:2px solid var(--g);box-shadow:none}
.btn.sm{padding:8px 16px;min-height:44px;font-size:16px}
.btn[disabled]{opacity:.5}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px;margin:14px 0}
.progress{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:22px;background:#eee6cf;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8fcf8a,var(--g));border-radius:99px;transition:width .5s}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{background:#eee6cf;color:#a09a82;border-radius:99px;padding:4px 12px;font-size:15px;font-weight:700}
.badge.on{background:#ffe9a8;color:#7a5200;box-shadow:0 0 0 2px #f2c94c}
.badge.main.on{font-size:18px;padding:8px 16px}
.mapbox{display:flex;justify-content:center}
.mapbox svg{width:100%;max-width:340px;height:auto;background:#eaf5ee;border-radius:22px}
.node{cursor:pointer}
.node circle{stroke:#fff;stroke-width:2}
.node text{font-size:10px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#fffdf6;stroke-width:3px}
.route{fill:none;stroke:#b9a878;stroke-width:2;stroke-dasharray:5 4}
.counties{display:grid;gap:10px;margin-top:8px}
.county{background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.county.next{border-color:var(--or);box-shadow:0 0 0 3px #fbe3c3}
.county.open{border-color:var(--g)}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;color:var(--ink);min-height:60px}
.ch .no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gl);color:var(--gd);display:grid;place-items:center;font-weight:700;font-size:15px}
.ch .nm{flex:1;font-weight:700;font-size:20px}
.ch .sub{display:block;font-weight:400;font-size:14px;color:var(--mute)}
.ch .st{font-size:14px;font-weight:700;border-radius:99px;padding:3px 10px;background:#eee6cf;color:var(--mute);white-space:nowrap}
.ch .st.go{background:var(--or);color:#4a2c00}.ch .st.ok{background:var(--gl);color:var(--gd)}
.cb{padding:0 12px 14px;display:none}
.county.open .cb{display:block}
.empty{padding:10px;color:var(--mute);background:#f6f0dc;border-radius:14px}
.shop{border:2px solid var(--line);border-radius:18px;padding:12px;margin-top:10px;background:#fff;position:relative}
.shop.stamped{border-color:var(--g);background:#f4fbf1}
.shop h3{margin:0 0 4px;font-size:20px}
.tag{display:inline-block;font-size:14px;background:var(--gl);color:var(--gd);border-radius:99px;padding:1px 10px;margin-right:6px}
.shop p{margin:6px 0;font-size:16px}
.shop .sum{color:var(--mute);font-size:15px}
.shop details{font-size:15px;color:var(--mute)}
.shop details pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:6px 0;background:#faf6e8;padding:8px;border-radius:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stampmark{position:absolute;right:10px;top:10px;width:64px;height:64px;border:4px solid var(--red);color:var(--red);border-radius:50%;display:none;place-items:center;text-align:center;font-weight:900;font-size:14px;line-height:1.1;transform:rotate(-14deg);opacity:.85}
.shop.stamped .stampmark{display:grid}
.stampmark.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(3) rotate(-40deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-14deg);opacity:.85}}
.shop.stamped h3{padding-right:76px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:#2f6b3c;color:#fff;border-radius:18px;padding:12px 20px;font-weight:700;transition:.4s;z-index:50;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:#fff;min-height:48px;flex:1;min-width:150px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:99px;padding:6px 14px;min-height:44px;background:#fff;user-select:none}
.chip input{width:20px;height:20px;accent-color:var(--g)}
.chip:has(input:checked){border-color:var(--g);background:var(--gl)}
.wheelbox{position:relative;width:min(88vw,420px);aspect-ratio:1;margin:16px auto}
.wc{position:absolute;inset:0;overflow:hidden;border-radius:50%;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.wheelbox canvas{will-change:transform;width:100%;height:100%;transition:transform 4.6s cubic-bezier(.12,.7,.1,1)}
.pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:32px solid var(--red);z-index:3;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2))}
.hub{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border-radius:50%;background:#fff;border:4px solid var(--g);display:grid;place-items:center;font-size:28px;z-index:2}
.center{text-align:center}
.result{border:3px solid var(--g);background:#f4fbf1;border-radius:22px;padding:16px;margin-top:10px;animation:pop2 .5s}
@keyframes pop2{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.result h2{margin:0 0 4px;color:var(--gd)}
.msg{background:#fff3d6;border-radius:14px;padding:10px 14px;margin-top:10px;font-size:16px}
footer{margin:24px 0 40px;padding:14px;background:#f0ead6;border-radius:18px;font-size:15px;color:var(--mute)}
footer p{margin:6px 0}
.hidden{display:none!important}
@media(min-width:900px){body{font-size:19px}.wrap{max-width:820px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>🌱 純素台灣大冒險</h1>
  <p>環島找純素店、蓋印章，或轉一轉決定待會吃什麼！</p>
</header>
<div class="modes">
  <button class="mode" id="m-adv" aria-pressed="true"><span class="e">🗺️</span>純素環島大冒險</button>
  <button class="mode" id="m-spin" aria-pressed="false"><span class="e">🎡</span>待會吃什麼</button>
</div>

<main>
<section id="adv">
  <div class="panel">
    <div class="progress"><b id="pl">環島進度</b><div class="bar"><i id="pbar" style="width:0"></i></div><b id="pt"></b></div>
    <div class="badges" id="badges"></div>
  </div>
  <div class="panel mapbox"><svg id="tmap" viewBox="0 0 340 420" role="img" aria-label="台灣環島路線示意圖（示意，非精準地圖）"></svg></div>
  <p class="center" style="color:var(--mute);font-size:15px;margin:0">🧭 路線示意圖（非精準地圖）：點圓點或下方卡片「抵達」縣市</p>
  <div class="counties" id="counties"></div>
  <div class="center" style="margin-top:16px"><button class="btn ghost sm" id="reset">🗑️ 重置進度</button></div>
</section>

<section id="spin" class="hidden">
  <div class="panel">
    <div class="row">
      <select id="sel" aria-label="選擇縣市"></select>
      <button class="btn alt sm" id="loc">📍 用我的位置</button>
    </div>
    <div class="chips" id="chips" aria-label="分類篩選"></div>
    <div class="msg hidden" id="smsg"></div>
  </div>
  <div class="wheelbox"><div class="pointer"></div><div class="wc"><canvas id="wheel" width="840" height="840"></canvas></div><div class="hub">🥗</div></div>
  <div class="center"><button class="btn" id="go" style="font-size:22px;padding:14px 40px">🎡 開始轉！</button></div>
  <div id="result"></div>
</section>
</main>

<footer>
  <p><b>資料來源：</b>VO2 蔬氧 全台純素店家地圖（Instagram @vo2.taipei）— <a id="srcl" href="#" target="_blank" rel="noopener">開啟原始 Google 地圖清單</a></p>
  <p>⚠️ 店家資訊以店家最新公告為準，出發前請確認營業時間與餐點內容。備註中「待確認」代表 VO2 尚在查核，不代表一定是純素。</p>
  <p>本遊戲為非官方的小玩具，進度只存在你這台裝置的瀏覽器裡。</p>
</footer>
</div>

  return out.length?out.join("\n"):"VO2 尚無更多備註，請以店家公告為準。";
}
function fullNote(p){return (p.note||"").split("\n").filter(l=>!/^EN:/.test(l)).join("\n")}
function safeUrl(u){return /^https:\/\/(www\.)?(maps\.google\.com|google\.com\/maps|maps\.app\.goo\.gl)/.test(u||"")?u:"#"}
const FOOD=c=>c==="餐廳"||c==="烘焙/咖啡/甜點"||c==="便當";

/* ===== 模式切換 ===== */

$("#srcl").href=DATA.source.url;

/* ===== 環島 ===== */
// 示意座標（0-340 x 0-420），離島放在邊角
const POS={"基隆市":[232,40],"臺北市":[214,52],"新北市":[196,66],"桃園市":[170,66],"新竹市":[150,88],"新竹縣":[172,100],"苗栗縣":[150,118],"臺中市":[140,146],"彰化縣":[112,166],"南投縣":[152,182],"雲林縣":[104,194],"嘉義市":[112,216],"嘉義縣":[140,224],"臺南市":[98,252],"高雄市":[104,288],"屏東縣":[128,332],"宜蘭縣":[246,84],"花蓮縣":[232,170],"臺東縣":[200,282],"澎湖縣":[50,196],"金門縣":[40,100],"連江縣":[64,30]};
const OUTLINE="M232,26 L254,70 L252,100 L248,150 L244,190 L232,240 L214,300 L186,350 L136,362 L120,336 L104,310 L84,270 L84,230 L92,200 L98,170 L118,140 L136,104 L156,78 L200,50 Z";
function counted(c){return byCounty[c].filter(p=>S.stamps[p.id]).length}
function renderMap(){
  const svg=$("#tmap");svg.textContent="";
  const NS="http://www.w3.org/2000/svg";
  const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
  svg.appendChild(mk("path",{d:OUTLINE,fill:"#cfe8c6",stroke:"#8fbf86","stroke-width":3,"stroke-linejoin":"round"}));
  const loop=["基隆市","臺北市","新北市","桃園市","新竹市","新竹縣","苗栗縣","臺中市","彰化縣","南投縣","雲林縣","嘉義市","嘉義縣","臺南市","高雄市","屏東縣","臺東縣","花蓮縣","宜蘭縣","基隆市"].map(c=>POS[c].join(","));
  svg.appendChild(mk("polyline",{points:loop.join(" "),class:"route"}));
  const nextC=ORDER.find(c=>!S.arrived[c]);
  ORDER.forEach(c=>{
    const [x,y]=POS[c];const g=mk("g",{class:"node",tabindex:0,role:"button","aria-label":c});
    const n=byCounty[c].length;const done=S.arrived[c];
    const fill=!n?"#d8d2bd":done?(counted(c)?"#4f9d5d":"#8fcf8a"):c===nextC?"#f2a65a":"#fff";
    g.appendChild(mk("circle",{cx:x,cy:y,r:done||c===nextC?8:6,fill}));
    const side=x>180||x<70&&x>30?1:-1;
    const t=mk("text",{x:x+(x>180?11:x<70?-0:-11),y:y+(x<70?-11:4),"text-anchor":x>180?"start":x<70?"middle":"end"});t.textContent=c.replace(/[市縣]$/,"");
    g.appendChild(t);
    g.onclick=()=>focusCounty(c);g.onkeydown=e=>{if(e.key==="Enter")focusCounty(c)};
    svg.appendChild(g);
  });
  const me=mk("text",{x:150,y:395,"text-anchor":"middle","font-size":12,fill:"#7a7766"});me.textContent="🌊 台灣海峽 ～ 太平洋 🌊";svg.appendChild(me);
}
function focusCounty(c){const e=document.getElementById("c-"+c);if(e){e.scrollIntoView({behavior:"smooth",block:"center"});e.classList.add("open")}}
function renderProgress(){
  const done=withShops.filter(c=>counted(c)>0).length,tot=withShops.length;
  $("#pbar").style.width=(tot?done/tot*100:0)+"%";
  $("#pt").textContent=done+" / "+tot+" 縣市已蓋章";
  const b=$("#badges");b.textContent="";
  const master=done===tot&&tot>0;
  const bm=el("span","badge main"+(master?" on":""),(master?"🏆 ":"🔒 ")+"純素環島達人");b.appendChild(bm);
  const arrivedN=ORDER.filter(c=>S.arrived[c]).length;
  [["👣 出發囉",arrivedN>=1],["🧳 抵達 5 縣市",arrivedN>=5],["📮 第一個印章",Object.keys(S.stamps).length>=1]].forEach(([t,on])=>b.appendChild(el("span","badge"+(on?" on":""),t)));
  withShops.forEach(c=>{if(byCounty[c].length>=2&&counted(c)===byCounty[c].length)b.appendChild(el("span","badge on","🌟 "+c.replace(/[市縣]$/,"")+"全收集"))});
  return master;
}
let wasMaster=null;
function renderCounties(openSet){
  const root=$("#counties");root.textContent="";
  const nextC=ORDER.find(c=>!S.arrived[c]);
  ORDER.forEach((c,i)=>{
    const shops=byCounty[c],n=shops.length;
    const d=el("div","county"+(c===nextC?" next":"")+(openSet.has(c)?" open":""));d.id="c-"+c;
    const h=el("button","ch");
    h.appendChild(el("span","no",String(i+1)));
    const nm=el("span","nm",c);
    nm.appendChild(el("span","sub",n?(S.arrived[c]?"已蓋 "+counted(c)+" / "+n+" 間":"共 "+n+" 間純素店等你"):"尚無收錄店家"));
    h.appendChild(nm);
    h.appendChild(el("span","st "+(S.arrived[c]?"ok":"go"),S.arrived[c]?"✅ 已抵達":c===nextC?"下一站":"未抵達"));
    h.onclick=()=>{d.classList.toggle("open")};
    d.appendChild(h);
    const body=el("div","cb");
    if(!S.arrived[c]){
      const b=el("button","btn",n?"🚩 抵達"+c+"，解鎖店家！":"🚩 路過"+c);
      b.onclick=()=>{S.arrived[c]=1;save();toast("🎉 抵達"+c+"！"+(n?"解鎖 "+n+" 間純素店":"這裡尚無收錄店家"));refresh(new Set([c]))};
      body.appendChild(b);
      if(!n)body.appendChild(el("div","empty","尚無收錄店家"));
    }else if(!n){body.appendChild(el("div","empty","尚無收錄店家（資料只收錄 VO2 清單內的店）"))}
    else shops.forEach(p=>body.appendChild(shopCard(p)));
    d.appendChild(body);root.appendChild(d);
  });
}
function shopCard(p){
  const s=el("div","shop"+(S.stamps[p.id]?" stamped":""));
  s.dataset.id=p.id;
  const h=el("h3",null,p.name);s.appendChild(h);
  const meta=el("div");meta.appendChild(el("span","tag",p.category));if(p.district)meta.appendChild(el("span",null,p.district));s.appendChild(meta);
  s.appendChild(el("p",null,"📍 "+addr(p)));
  const sm=el("p","sum",summary(p));sm.style.whiteSpace="pre-line";s.appendChild(sm);
  const dt=el("details");dt.appendChild(el("summary",null,"看 VO2 完整備註"));dt.appendChild(el("pre",null,fullNote(p)));s.appendChild(dt);
  const sm2=el("div","stampmark");sm2.innerHTML="";sm2.appendChild(document.createTextNode("純素"));sm2.appendChild(document.createElement("br"));sm2.appendChild(document.createTextNode("到此一遊"));s.appendChild(sm2);
  const a=el("div","acts");
  const l=el("a","btn ghost sm","🗺️ 在 Google 地圖開啟");l.href=safeUrl(p.maps_url);l.target="_blank";l.rel="noopener";a.appendChild(l);
  const b=el("button","btn sm"+(S.stamps[p.id]?" ghost":""),S.stamps[p.id]?"✔ 已蓋章（點擊取消）":"🐾 我去過了，蓋章");
  b.onclick=()=>{
    if(S.stamps[p.id]){delete S.stamps[p.id];save();refresh(new Set([p.county]));return}
    S.stamps[p.id]=1;save();
    s.classList.add("stamped");sm2.classList.add("pop");
    b.textContent="✔ 已蓋章（點擊取消）";b.classList.add("ghost");
    toast("🐾 蓋章成功！"+p.name);
    setTimeout(()=>refresh(new Set([p.county]),true),900);
  };
  a.appendChild(b);s.appendChild(a);return s;
}
function refresh(openSet,keepScroll){
  if(!openSet)openSet=new Set([...document.querySelectorAll(".county.open")].map(e=>e.id.slice(2)));
  const y=scrollY;
  const m=renderProgress();renderMap();renderCounties(openSet);
  if(keepScroll)scrollTo(0,y);
  if(wasMaster===false&&m)toast("🏆 恭喜！獲得「純素環島達人」徽章！");
  wasMaster=m;
}
$("#reset").onclick=()=>{
  if(confirm("確定要重置所有環島進度嗎？印章與徽章都會清空，無法復原。")){S={arrived:{},stamps:{}};save();wasMaster=null;refresh(new Set());toast("已重置進度")}
};

/* ===== 轉盤 ===== */
const sel=$("#sel");
sel.appendChild(new Option("請選擇縣市…",""));
withShops.forEach(c=>sel.appendChild(new Option(c+"（"+byCounty[c].length+"）",c)));
const CATS=[...new Set(P.map(p=>p.category))];
const chipsEl=$("#chips");
CATS.forEach(c=>{const l=el("label","chip");const i=document.createElement("input");i.type="checkbox";i.value=c;i.checked=FOOD(c);l.appendChild(i);l.appendChild(document.createTextNode(c));chipsEl.appendChild(l)});
let userPos=null,spinning=false,slices=[],rot=0;
const COLORS=["#8fcf8a","#ffe08a","#f7b787","#bfe3b4","#ffd0a8","#d7ecb0","#f9c9c9","#a9dcc7","#fbe7a1","#c9e8a0","#f5be8a","#b5ddb0"];
function cats(){return [...chipsEl.querySelectorAll("input:checked")].map(i=>i.value)}
function sm(msg){const m=$("#smsg");m.textContent=msg||"";m.classList.toggle("hidden",!msg)}
function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function trunc(s,n){return s.length>n?s.slice(0,n-1)+"…":s}
function buildPool(){
  const cs=cats();let pool=P.filter(p=>cs.includes(p.category));
  let info="";
  if(sel.value){pool=pool.filter(p=>p.county===sel.value);}
  else if(userPos){pool=pool.map(p=>Object.assign({},p,{_d:hav(userPos.lat,userPos.lng,p.lat,p.lng)})).sort((a,b)=>a._d-b._d).slice(0,12)}
  else pool=[];
  if(userPos&&sel.value)pool=pool.map(p=>Object.assign({},p,{_d:hav(userPos.lat,userPos.lng,p.lat,p.lng)}));
  return pool;
}
function draw(){
  const pool=buildPool();
  const cv=$("#wheel"),x=cv.getContext("2d"),W=cv.width,R=W/2;
  x.clearRect(0,0,W,W);
  if(pool.length>12||pool.length>8&&false){}
  let n=pool.length;
  if(n>12)n=8+Math.floor(Math.random()*5);
  slices=n>=pool.length?pool:shuffle(pool).slice(0,n);
  if(!slices.length){
    x.fillStyle="#eee6cf";x.beginPath();x.arc(R,R,R-6,0,7);x.fill();
    x.fillStyle="#7a7766";x.font="bold 40px sans-serif";x.textAlign="center";
    x.fillText(cats().length?"請先選縣市或用位置":"請至少選一種分類",R,R-20);x.fillText("再來轉轉看 🎡",R,R+34);return;
  }
  const a=2*Math.PI/slices.length;
  slices.forEach((p,i)=>{
    const s0=-Math.PI/2+i*a,s1=s0+a;
    x.beginPath();x.moveTo(R,R);x.arc(R,R,R-6,s0,s1);x.closePath();x.fillStyle=COLORS[i%COLORS.length];x.fill();x.lineWidth=4;x.strokeStyle="#fffdf6";x.stroke();
    x.save();x.translate(R,R);x.rotate(s0+a/2);x.textAlign="right";x.textBaseline="middle";x.fillStyle="#3b3a30";
    x.font="bold "+(slices.length>9?34:40)+"px 'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif";
    x.fillText(trunc(p.name,7),R-36,0);x.restore();
  });
  x.lineWidth=10;x.strokeStyle="#fffdf6";x.beginPath();x.arc(R,R,R-3,0,7);x.stroke();
}
function redraw(){if(spinning)return;$("#result").textContent="";const w=$("#wheel");w.style.transition="none";rot=0;w.style.transform="rotate(0deg)";draw()}
sel.onchange=()=>{if(sel.value){sm("")}redraw()};
chipsEl.onchange=redraw;
$("#loc").onclick=()=>{
  if(!navigator.geolocation){sm("這個瀏覽器不支援定位，請改用下拉選單選縣市 😊");return}
  sm("定位中…");
  navigator.geolocation.getCurrentPosition(pos=>{
    userPos={lat:pos.coords.latitude,lng:pos.coords.longitude};sel.value="";
    sm("已用你的位置，挑出最近的店 📍");redraw();
    if(!slices.length)sm("已取得位置，但分類篩選後沒有店，請多選幾種分類。");
  },err=>{sm("無法取得位置（"+(err&&err.code===1?"你拒絕了定位":"定位失敗")+"），沒關係，請改用上方下拉選單選縣市 😊")},{timeout:10000,maximumAge:60000});
};
$("#go").onclick=()=>{
  if(spinning)return;
  if(!slices.length){sm(cats().length?"請先選縣市或按「用我的位置」":"請至少選一種分類");return}
  spinning=true;$("#go").disabled=true;$("#result").textContent="";
  const w=$("#wheel"),n=slices.length,a=360/n,win=Math.floor(Math.random()*n);
  const jitter=(Math.random()-.5)*a*.7;
  const turn=Math.ceil(rot/360)*360+360*5-(win+.5)*a+jitter;
  w.style.transition="";void w.offsetWidth;
  rot=turn;w.style.transform="rotate("+rot+"deg)";
  let done=false;
  const fin=()=>{if(done)return;done=true;spinning=false;$("#go").disabled=false;$("#go").textContent="🎡 再轉一次！";show(slices[win])};
  w.addEventListener("transitionend",fin,{once:true});setTimeout(fin,5200);
};
function show(p){
  const r=$("#result");r.textContent="";
  const d=el("div","result");
  d.appendChild(el("div",null,"🎉 就決定是這間！"));
  d.appendChild(el("h2",null,p.name));
  const m=el("div");m.appendChild(el("span","tag",p.category));m.appendChild(el("span",null,p.county+(p.district||"")));d.appendChild(m);
  d.appendChild(el("p",null,"📍 "+addr(p)));
  if(p._d!=null)d.appendChild(el("p",null,"🚶 距離你約 "+(p._d<1?Math.round(p._d*1000)+" 公尺":p._d.toFixed(1)+" 公里")+"（直線距離）"));
  const sm=el("p","sum",summary(p));sm.style.whiteSpace="pre-line";sm.style.color="var(--mute)";sm.style.fontSize="16px";d.appendChild(sm);
  const a=el("div","acts");
  const n=el("a","btn","🧭 開始導航");n.href=safeUrl(p.nav_url);n.target="_blank";n.rel="noopener";a.appendChild(n);
  const l=el("a","btn ghost","🗺️ 在 Google 地圖看店家");l.href=safeUrl(p.maps_url);l.target="_blank";l.rel="noopener";a.appendChild(l);
  d.appendChild(a);
  d.appendChild(el("p","sum","出發前請確認營業時間與餐點內容喔！"));
  r.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"nearest"});
}

refresh(new Set());
draw();
})();
</script>
