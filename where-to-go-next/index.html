<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7efe2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="下次去哪裡玩">
<meta name="description" content="台灣縣市景點轉盤，從臺中出發，篩選地區、類型後幫你抽出下次去哪裡玩。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>下次去哪裡玩</title>
<style>
:root{--bg:#f7efe2;--card:#fffaf2;--brown:#8b5a2b;--brown-d:#5e3a1a;--caramel:#c98a4b;--line:#ead9c0;--muted:#9a7b5c;--green:#5f9e5a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--brown-d);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top) 0 40px;overflow-x:hidden}
button{font-family:inherit}
.wrap{max-width:480px;margin:0 auto;padding:16px}
header{text-align:center;margin:6px 0 10px}
header h1{margin:0;font-size:28px;letter-spacing:2px}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--card);border-radius:22px;box-shadow:0 4px 14px rgba(139,90,43,.12);padding:16px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--brown);cursor:pointer;user-select:none}
.chip.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.chip.soft.on{background:var(--caramel);border-color:var(--caramel);color:#fff}
.lab{display:block;text-align:center;color:var(--muted);font-size:12px;margin:8px 0 6px}
.badge{display:inline-block;background:#fde3c2;color:var(--brown-d);border-radius:999px;padding:4px 10px;font-size:13px;margin:0 auto 8px}
.wheelbox{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--brown-d);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:22%;height:22%;border-radius:50%;background:var(--card);border:4px solid var(--brown);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--brown);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--muted);font-size:16px;line-height:1.6}
.spin{display:block;width:100%;margin-top:14px;border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:700;letter-spacing:2px;color:#fff;background:linear-gradient(180deg,var(--caramel),var(--brown));box-shadow:0 5px 0 var(--brown-d);cursor:pointer}
.spin:active{transform:translateY(3px);box-shadow:0 2px 0 var(--brown-d)}
.spin:disabled{opacity:.5;cursor:not-allowed;transform:none}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:16px 0 8px;color:var(--brown)}
.region-title{margin:18px 0 8px;font-size:15px;letter-spacing:1px;color:var(--muted);text-align:center}
.row{display:flex;align-items:flex-start;gap:8px;padding:12px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .info{flex:1;min-width:0}
.row .name{font-weight:700;word-break:break-word}
.row .note{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.55;word-break:break-word}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 6px;margin:0 4px 0 0;background:#e4f1df;color:#3d6b39;vertical-align:middle;font-weight:600}
.tag.t-觀光工廠{background:#fde3c2;color:var(--brown-d)}
.tag.t-親子{background:#e8f0fb;color:#3a5a8a}
.tag.t-素食友善{background:#e4f1df;color:#3d6b39}
.maps{flex:none;border:0;background:var(--brown);color:#fff;text-decoration:none;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.cluster-head{background:#f7e6cc;border-radius:16px;padding:8px 12px;margin:8px 0 0;font-weight:700;color:var(--brown-d);font-size:14px}
.btn{border:0;border-radius:12px;padding:11px;font-size:16px;font-weight:700;background:var(--brown);color:#fff;cursor:pointer}
.btn.ghost{background:none;color:var(--muted);border:1.5px dashed var(--line);font-weight:500}
.mask{position:fixed;inset:0;background:rgba(60,35,15,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:24px}
.mask.show{display:flex}
.result{background:var(--card);border-radius:26px;padding:26px 20px;text-align:center;max-width:360px;width:100%;animation:pop .35s ease;max-height:86vh;overflow:auto}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.result .emo{font-size:52px}
.result .rname{font-size:28px;font-weight:800;margin:6px 0}
.result .rnote{color:var(--muted);line-height:1.6;font-size:15px}
.result a{color:var(--brown);font-weight:700}
.result .acts{display:flex;gap:8px;margin-top:18px}
.result .acts button{flex:1}
.exts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.exts a{flex:1;min-width:120px;background:var(--brown);color:#fff;text-decoration:none;border-radius:12px;padding:10px 8px;font-weight:700}
.small{font-size:12px;color:var(--muted);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:11}
.sound{position:absolute;right:16px;top:10px;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<button type="button" class="sound" id="soundBtn" aria-pressed="true">🔊 聲音開</button>
<div class="wrap">
  <header>
    <h1>🗺️ 下次去哪裡玩</h1>
    <p>台灣景點轉盤・從臺中豐樂公園出發</p>
  </header>

  <div class="card">
    <span class="lab">地區</span>
    <div class="chips" id="regionChips"></div>
    <span class="lab">縣市（由北到南）</span>
    <div class="chips" id="countyChips"></div>
    <span class="lab">類型（可複選，需同時符合）</span>
    <div class="chips" id="tagChips"></div>
  </div>

  <div class="card">
    <div style="text-align:center"><span class="badge" id="status"></span></div>
    <div class="wheelbox">
      <div class="pointer"></div>
      <canvas id="wheel" width="720" height="720"></canvas>
      <div class="hub" id="hub">轉!</div>
      <div class="empty" id="empty"></div>
    </div>
    <button type="button" class="spin" id="spinBtn">🎯 開始轉</button>
    <p class="small" id="wheelHint" style="margin:10px 0 0"></p>
  </div>

  <div class="card">
    <h2>📋 景點清單 <span class="small" id="count"></span></h2>
    <p class="small" style="text-align:left;margin:0 0 8px">資料為常見公開景點，營業與開放請以現場或官方公告為準。地圖連結會打開 Google 地圖搜尋。</p>
    <div id="list"></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="result">
    <div class="emo" id="rEmo">🎉</div>
    <div class="rname" id="rName"></div>
    <div class="rnote" id="rNote"></div>
    <div class="exts" id="rExts"></div>
    <div class="acts">
      <button type="button" class="btn ghost" id="againBtn" style="margin:0">再轉一次</button>
      <button type="button" class="btn" id="okBtn">就去這裡！</button>
    </div>
  </div>
</div>

<script src="./places.js"></script>
<script>
const COLORS=['#f4a259','#e76f51','#f6bd60','#84a59d','#f28482','#b5838d','#90be6d','#e9c46a','#c98a4b','#6d9dc5','#f7a072','#a3c4bc'];
const EMO=['🗺️','🧳','🏔️','🌊','🎢','🎉','🌸','🚃'];
const DATA=window.PLACE_DATA;
const DAYTRIP_HINTS=['適合一日遊','半日／市區就近'];

const state={
  region:'all',
  county:'all',
  cluster:'all',
  tags:[],
  daytrip:false,
  sound:true
};

let cur=[], rot=0, spinning=false, lastSlice=-1, lastTick=0;
const canvas=document.getElementById('wheel');
const ctx=canvas.getContext('2d');
const cc=document.getElementById('confetti');
const cx=cc.getContext('2d');

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function filtered(){
  return DATA.places.filter(p=>{
    if(state.region!=='all' && p.region!==state.region) return false;
    if(state.county!=='all' && p.county!==state.county) return false;
    if(state.cluster!=='all' && p.cluster!==state.cluster) return false;
    if(state.daytrip && !DAYTRIP_HINTS.includes(p.hint)) return false;
    if(state.tags.length && !state.tags.every(t=>p.tags.includes(t))) return false;
    return true;
  });
}

function visibleCounties(){
  return DATA.counties.filter(c=>state.region==='all' || c.region===state.region);
}

function showJijiChip(){
  return state.region==='all' || state.region==='中部' || state.county==='南投縣' || state.cluster==='集集';
}

function renderChips(){
  const rc=document.getElementById('regionChips');
  rc.innerHTML='';
  [['all','全部'],...DATA.regions.map(r=>[r,r]),['daytrip','從臺中一日遊']].forEach(([id,label])=>{
    const el=document.createElement('div');
    el.className='chip'+(id==='daytrip'?' soft':'');
    if(id==='daytrip' ? state.daytrip : state.region===id) el.classList.add('on');
    el.textContent=label;
    el.onclick=()=>{
      if(id==='daytrip'){
        state.daytrip=!state.daytrip;
        if(state.daytrip){state.region='all';state.county='all';state.cluster='all';}
      }else{
        state.region=id;
        state.county='all';
        if(id!=='all' && id!=='中部') state.cluster='all';
        if(state.cluster==='集集' && id!=='all' && id!=='中部') state.cluster='all';
      }
      refresh();
    };
    rc.appendChild(el);
  });

  const ccEl=document.getElementById('countyChips');
  ccEl.innerHTML='';
  const all=document.createElement('div');
  all.className='chip'+(state.county==='all'&&state.cluster==='all'?' on':'');
  all.textContent='全部縣市';
  all.onclick=()=>{state.county='all';state.cluster='all';refresh();};
  ccEl.appendChild(all);
  visibleCounties().forEach(c=>{
    const el=document.createElement('div');
    el.className='chip'+(state.county===c.name&&state.cluster==='all'?' on':'');
    el.textContent=c.name;
    el.onclick=()=>{
      state.county=c.name;
      state.region=c.region;
      state.cluster='all';
      refresh();
    };
    ccEl.appendChild(el);
    if(c.name==='南投縣' && showJijiChip()){
      const j=document.createElement('div');
      j.className='chip soft'+(state.cluster==='集集'?' on':'');
      j.textContent='集集';
      j.onclick=()=>{
        state.county='南投縣';
        state.region='中部';
        state.cluster='集集';
        refresh();
      };
      ccEl.appendChild(j);
    }
  });

  const tc=document.getElementById('tagChips');
  tc.innerHTML='';
  DATA.tags.forEach(t=>{
    const el=document.createElement('div');
    el.className='chip'+(state.tags.includes(t)?' on':'');
    el.textContent=t;
    el.onclick=()=>{
      const i=state.tags.indexOf(t);
      if(i>=0) state.tags.splice(i,1); else state.tags.push(t);
      refresh();
    };
    tc.appendChild(el);
  });
}

function tagHtml(tags){
  return tags.map(t=>'<span class="tag t-'+esc(t)+'">'+esc(t)+'</span>').join('');
}

function renderList(){
  const list=document.getElementById('list');
  const groups=[];
  let lastKey='';
  cur.forEach(p=>{
    const cluster=p.cluster||'';
    const key=p.county+'|'+cluster;
    if(key!==lastKey){
      groups.push({county:p.county,region:p.region,cluster,items:[]});
      lastKey=key;
    }
    groups[groups.length-1].items.push(p);
  });
  let html='';
  let lastRegion='';
  groups.forEach(g=>{
    if(g.region!==lastRegion){
      html+='<div class="region-title">'+esc(g.region)+'</div>';
      lastRegion=g.region;
    }
    if(g.cluster){
      html+='<div class="cluster-head">📍 '+esc(g.county)+'・'+esc(g.cluster)+'景點</div>';
    }else{
      const hasCluster=groups.some(x=>x.county===g.county && x.cluster);
      html+='<h3>'+esc(g.county)+(hasCluster?'・其他景點':'')+'</h3>';
    }
    g.items.forEach(p=>{
      html+='<div class="row"><div class="info"><div class="name">'+esc(p.name)+' '+tagHtml(p.tags)+'</div>';
      html+='<div class="note">'+esc(p.desc)+(p.address?'<br>'+esc(p.address):'')+'</div></div>';
      html+='<a class="maps" href="'+esc(p.maps)+'" target="_blank" rel="noopener">地圖</a></div>';
    });
  });
  list.innerHTML=html||'<p class="small">這個條件下沒有景點，試試少選一個類型，或改選其他地區。</p>';
  document.getElementById('count').textContent='（'+cur.length+'）';
}

function draw(){
  cur=filtered();
  const n=cur.length,R=360;
  ctx.clearRect(0,0,720,720);
  const empty=document.getElementById('empty');
  document.getElementById('spinBtn').disabled=spinning||n<2;
  document.getElementById('status').textContent=n?('可轉 '+n+' 個景點'):'沒有符合的景點';
  const hint=document.getElementById('wheelHint');
  if(n>16) hint.textContent='景點比較多，轉盤上不逐一寫名字，轉出來會顯示完整資訊。';
  else hint.textContent=state.daytrip?'以臺中出發、較適合當日往返的中部鄰近縣市為主。':'篩好條件再轉；也可以直接從下面清單挑。';
  if(n<2){
    ctx.beginPath();ctx.arc(R,R,R-8,0,7);ctx.fillStyle='#f1e4cf';ctx.fill();
    empty.style.display='flex';document.getElementById('hub').style.display='none';
    empty.innerHTML=n===0?'轉盤空空的 🥲<br>換個地區或少選一個類型吧！':'只剩一處：<b>'+esc(cur[0].name)+'</b><br>不用轉了，就去這裡吧！';
    return;
  }
  empty.style.display='none';document.getElementById('hub').style.display='flex';
  const a=2*Math.PI/n;
  ctx.save();ctx.translate(R,R);ctx.rotate(rot);
  for(let i=0;i<n;i++){
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R-8,i*a,(i+1)*a);ctx.closePath();
    ctx.fillStyle=COLORS[(i+(n%COLORS.length===1&&i===n-1?1:0))%COLORS.length];ctx.fill();
    ctx.strokeStyle='#fffaf2';ctx.lineWidth=n>24?1:4;ctx.stroke();
    if(n<=16){
      ctx.save();ctx.rotate(i*a+a/2);ctx.fillStyle='#fff';
      const fs=n>14?26:n>9?30:36;ctx.font='bold '+fs+'px "PingFang TC","Noto Sans TC",sans-serif';
      ctx.textAlign='right';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=3;
      let t=cur[i].name;if(t.length>7)t=t.slice(0,6)+'…';
      ctx.fillText(t,R-34,0);ctx.restore();
    }
  }
  ctx.restore();
  ctx.beginPath();ctx.arc(R,R,R-6,0,7);ctx.lineWidth=12;ctx.strokeStyle='#8b5a2b';ctx.stroke();
  for(let i=0;i<24;i++){const t=i/24*2*Math.PI;ctx.beginPath();ctx.arc(R+(R-6)*Math.cos(t),R+(R-6)*Math.sin(t),4,0,7);ctx.fillStyle=i%2?'#ffe8a3':'#fff';ctx.fill();}
}

let audioCtx=null;
function ac(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function blip(){
  if(!state.sound)return;
  try{
    const c=ac(),o=c.createOscillator(),g=c.createGain();
    o.frequency.value=720;g.gain.value=0.05;
    o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.06);o.stop(c.currentTime+0.07);
  }catch(e){}
}
function chime(){
  if(!state.sound)return;
  try{
    const c=ac();
    [523,659,784].forEach((f,i)=>{
      const o=c.createOscillator(),g=c.createGain();
      o.frequency.value=f;g.gain.value=0.06;
      o.connect(g);g.connect(c.destination);
      o.start(c.currentTime+i*0.08);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+i*0.08+0.25);o.stop(c.currentTime+i*0.08+0.26);
    });
  }catch(e){}
}
function tickIfCrossed(now){
  const n=cur.length;if(n<2)return;
  const a=2*Math.PI/n;
  let ang=(-rot-Math.PI/2)%(2*Math.PI);if(ang<0)ang+=2*Math.PI;
  const idx=Math.floor(ang/a)%n;
  if(idx!==lastSlice){lastSlice=idx;if(now-lastTick>70){lastTick=now;blip();}}
}

function spin(){
  if(spinning||cur.length<2)return;
  spinning=true;
  const n=cur.length,a=2*Math.PI/n,pick=Math.floor(Math.random()*n);
  const target=-Math.PI/2-(pick*a+a/2)+(Math.random()-.5)*a*0.7;
  const base=rot-(rot%(2*Math.PI));
  let end=base+6*2*Math.PI+((target-base)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const start=rot,dur=4200,t0=performance.now();
  document.getElementById('spinBtn').disabled=true;
  (function step(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);
    rot=start+(end-start)*e;draw();
    tickIfCrossed(now);
    if(p<1)requestAnimationFrame(step);
    else{
      spinning=false;rot%=2*Math.PI;draw();
      chime();show(cur[pick]);
    }
  })(t0);
}

function confetti(){
  cc.width=innerWidth;cc.height=innerHeight;
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*6+4,c:COLORS[Math.floor(Math.random()*COLORS.length)],r:Math.random()*6}));
  let f=0;(function tick(){cx.clearRect(0,0,cc.width,cc.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);cx.restore();});
    if(++f<110)requestAnimationFrame(tick);else cx.clearRect(0,0,cc.width,cc.height);})();
}

function show(p){
  document.getElementById('rEmo').textContent=EMO[Math.floor(Math.random()*EMO.length)];
  document.getElementById('rName').textContent=p.name;
  let h=tagHtml(p.tags);
  h+='<div style="margin-top:8px">'+esc(p.county)+(p.cluster?'・'+esc(p.cluster):'')+'</div>';
  h+='<div style="margin-top:8px">'+esc(p.desc)+'</div>';
  if(p.address) h+='<div style="margin-top:6px">'+esc(p.address)+'</div>';
  if(p.hint) h+='<div style="margin-top:6px">從臺中出發：'+esc(p.hint)+'</div>';
  document.getElementById('rNote').innerHTML=h;
  const exts=[];
  exts.push('<a href="'+esc(p.maps)+'" target="_blank" rel="noopener">📍 Google 地圖</a>');
  if(p.official) exts.push('<a href="'+esc(p.official)+'" target="_blank" rel="noopener">官方網站</a>');
  document.getElementById('rExts').innerHTML=exts.join('');
  document.getElementById('mask').classList.add('show');
  confetti();
}

function hide(){document.getElementById('mask').classList.remove('show');}

function refresh(){
  renderChips();
  cur=filtered();
  draw();
  renderList();
}

document.getElementById('spinBtn').onclick=spin;
document.getElementById('hub').onclick=spin;
document.getElementById('againBtn').onclick=()=>{hide();spin();};
document.getElementById('okBtn').onclick=hide;
document.getElementById('mask').addEventListener('click',e=>{if(e.target.id==='mask')hide();});
document.getElementById('soundBtn').onclick=function(){
  state.sound=!state.sound;
  this.textContent=state.sound?'🔊 聲音開':'🔇 聲音關';
  this.setAttribute('aria-pressed',state.sound?'true':'false');
};

if(!DATA||!DATA.places){document.body.innerHTML='<p style="padding:24px">景點資料載入失敗。</p>';}
else refresh();
</script>
</body>
</html>
